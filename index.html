<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit arrivée · CDG</title>
<style>
  #gsf2-root {
    --bg: #F7F8FB;
    --panel: #FFFFFF;
    --panel-2: #F0F2F7;
    --border: #E3E6ED;
    --text: #12172B;
    --text-dim: #626A82;
    --text-faint: #9AA1B5;
    --primary: #B91C3C;
    --primary-bg: #FBE3E8;
    --success: #059669;
    --success-bg: #DCFAEF;
    --warning: #D97706;
    --warning-bg: #FEF0D8;
    --danger: #DC2626;
    --danger-bg: #FDE4E2;
    --danger-text: #8A1F1F;
    --primary-ink: #B91C3C;
    --hover: #E4E7F0;
    --bistatut-bg: #FFF6D6;
    --bistatut-border: #E8B900;
    --alert-bg: #FCE4E7;
    --shadow: 0 6px 20px rgba(18, 23, 43, 0.08);
    --mono: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;

    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    border-radius: 18px;
    max-width: 1120px;
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #gsf2-root * { box-sizing: border-box; }

  .gsf2-header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 20px 24px 16px; }
  .gsf2-header-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .gsf2-brand { display: flex; align-items: center; gap: 10px; }
  .gsf2-logo {
    width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), #E1435F);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; font-family: var(--mono);
  }
  .gsf2-brand-text-title { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .gsf2-brand-text-sub { font-size: 11.5px; color: var(--text-faint); }

  .gsf2-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .gsf2-agent-field { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border-radius: 20px; padding: 5px 6px 5px 14px; }
  .gsf2-agent-field label { font-size: 11px; color: var(--text-dim); font-weight: 600; }
  .gsf2-agent-field input {
    width: 90px; border: none; background: var(--panel); border-radius: 14px; padding: 5px 10px; font-size: 12.5px; color: var(--text);
  }
  .gsf2-clock { font-family: var(--mono); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .gsf2-status-line { font-size: 11.5px; font-weight: 600; margin: 2px 0 12px; }

  .gsf2-stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .gsf2-stat {
    flex: 1; min-width: 100px; background: var(--panel-2); border-radius: 12px; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .gsf2-stat-num { font-family: var(--mono); font-size: 20px; font-weight: 800; }
  .gsf2-stat-label { font-size: 10.5px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }

  .gsf2-alert {
    display: none; background: var(--danger-bg); color: var(--danger-text); padding: 10px 24px; font-size: 13px; font-weight: 600;
    align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .gsf2-alert.show { display: flex; }
  .gsf2-alert strong { font-family: var(--mono); }

  .gsf2-tabs { display: flex; gap: 6px; padding: 14px 24px 0; }
  .gsf2-tab {
    font-size: 13px; font-weight: 700; color: var(--text-dim); background: var(--panel-2); border: none;
    padding: 10px 20px; border-radius: 10px 10px 0 0; cursor: pointer;
  }
  .gsf2-tab.active { background: var(--primary); color: #fff; }

  .gsf2-body { padding: 22px 24px 26px; background: var(--panel-2); min-height: 240px; }

  .gsf2-toolbar { background: var(--panel); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .gsf2-toolbar summary { cursor: pointer; font-weight: 700; font-size: 13.5px; list-style: none; display: flex; align-items: center; gap: 8px; }
  .gsf2-toolbar summary::-webkit-details-marker { display: none; }
  .gsf2-toolbar summary::before { content: "▸"; color: var(--primary); font-size: 11px; transition: transform 0.15s; }
  .gsf2-toolbar[open] summary::before { transform: rotate(90deg); }
  .gsf2-toolbar-content { margin-top: 14px; }
  .gsf2-toolbar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 10px; }
  .gsf2-toolbar textarea, .gsf2-toolbar input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font-size: 12.5px; font-family: var(--sans);
  }
  .gsf2-toolbar textarea.mono { font-family: var(--mono); font-size: 13.5px; line-height: 1.9; letter-spacing: 0.2px; }
  .gsf2-help-text { font-size: 12px; color: var(--text-dim); margin: 8px 0; line-height: 1.5; }
  .gsf2-help-text code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); }

  .gsf2-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700; border: none; border-radius: 9px;
    padding: 10px 18px; cursor: pointer; background: var(--primary); color: #fff;
  }
  .gsf2-btn:hover { background: #8F1730; }
  .gsf2-btn-ghost { background: var(--panel-2); color: var(--text-dim); }
  .gsf2-btn-ghost:hover { color: var(--text); background: var(--hover); }
  .gsf2-btn-sm { font-size: 12px; padding: 7px 12px; border-radius: 7px; }

  .gsf2-filterbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .gsf2-filterbar select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 9px;
    padding: 8px 12px; font-size: 12.5px; font-weight: 600;
  }
  .gsf2-gate-pills { display: flex; gap: 6px; }
  .gsf2-gate-pill {
    font-family: var(--mono); font-weight: 800; font-size: 13px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text-dim); padding: 8px 18px; border-radius: 10px; cursor: pointer;
  }
  .gsf2-gate-pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .gsf2-grid { display: flex; flex-direction: column; gap: 5px; }

  .gsf2-card { background: var(--panel); border-radius: 10px; padding: 6px 12px; border: 1px solid var(--border); position: relative; }
  .gsf2-card.is-expanded { padding: 8px 12px 11px; }
  .gsf2-card.is-bistatut { border: 2px solid var(--bistatut-border); background: var(--bistatut-bg); }
  .gsf2-bistatut-chip {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; font-weight: 800;
    background: var(--panel-2); color: var(--text-faint); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; cursor: pointer; margin-bottom: 7px; margin-right: 6px;
  }
  .gsf2-bistatut-chip.on { background: #E8B900; border-color: #E8B900; color: #3A2E00; }
  .gsf2-card.is-complete { opacity: 0.72; }

  .gsf2-card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; min-height: 18px; }
  .gsf2-card-row-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; flex: 1; }
  .gsf2-card-vol { font-family: var(--mono); font-size: 13.5px; font-weight: 800; flex-shrink: 0; }
  .gsf2-card-gate {
    font-family: var(--mono); font-weight: 800; font-size: 11px; background: var(--primary-bg); color: var(--primary-ink);
    border-radius: 7px; padding: 2px 7px; flex-shrink: 0;
  }
  .gsf2-card-gate.unassigned { background: var(--danger-bg); color: var(--danger); }
  .gsf2-card-row-meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); white-space: nowrap; }
  .gsf2-card-row-bus { font-size: 12px; flex-shrink: 0; }
  .gsf2-card-row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .gsf2-progress-text { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--text-dim); white-space: nowrap; }
  .gsf2-progress-text.all-done { color: var(--success); }
  .gsf2-chevron { color: var(--text-faint); font-size: 10px; width: 12px; text-align: center; transition: transform 0.15s; flex-shrink: 0; }
  .gsf2-card.is-expanded .gsf2-chevron { transform: rotate(90deg); }
  .gsf2-card-body { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .gsf2-card-delete { position: absolute; top: 7px; right: 10px; background: transparent; border: none; color: var(--text-faint); font-size: 13px; cursor: pointer; z-index: 2; }
  .gsf2-card-delete:hover { color: var(--danger); }
  .gsf2-card.has-delete .gsf2-card-row { padding-right: 20px; }
  .gsf2-card-meta { font-family: var(--mono); font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; margin-bottom: 9px; flex-wrap: wrap; }
  .gsf2-card-meta .sep { color: var(--text-faint); }

  .gsf2-blocreel-btn, .gsf2-blocreel-done {
    font-family: var(--mono); font-size: 11px; font-weight: 700; border: 1px solid var(--border);
    border-radius: 7px; padding: 3px 8px; cursor: pointer; background: var(--panel-2); color: var(--text-dim);
  }
  .gsf2-blocreel-done { background: var(--primary-bg); border-color: var(--primary); color: var(--primary-ink); }

  .gsf2-stepper { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .gsf2-step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
  .gsf2-step:not(:last-child)::after {
    content: ""; position: absolute; top: 13px; left: calc(50% + 16px); right: calc(-50% + 16px);
    height: 2px; background: var(--border);
  }
  .gsf2-step-circle {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); background: var(--panel);
    display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 800; font-size: 10.5px;
    color: var(--text-faint); cursor: pointer; z-index: 1; flex-shrink: 0;
  }
  .gsf2-step-circle.done { background: var(--success); border-color: var(--success); color: #fff; }
  .gsf2-step-circle.overdue { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .gsf2-step-circle.soon { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
  .gsf2-step-label { font-size: 8px; color: var(--text-dim); font-weight: 700; margin-top: 3px; text-align: center; line-height: 1.1; }
  .gsf2-step-time { font-size: 8px; font-family: var(--mono); color: var(--text-faint); margin-top: 0px; }

  .gsf2-validate-box {
    display: flex; align-items: center; gap: 6px; background: var(--primary-bg); border: 1px solid var(--primary);
    border-radius: 9px; padding: 8px 10px; margin-bottom: 12px;
  }
  .gsf2-validate-box input {
    flex: 1; border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; color: var(--text);
  }
  .gsf2-validate-box button {
    border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .gsf2-validate-confirm { background: var(--primary); color: #fff; }
  .gsf2-validate-cancel { background: var(--panel-2); color: var(--text-dim); }

  .gsf2-forced-chip {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; font-weight: 700;
    background: var(--panel-2); color: var(--text-faint); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; cursor: pointer; margin-bottom: 10px;
  }
  .gsf2-forced-chip.on { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }


  .gsf2-section-label { font-size: 11px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px; }
  .gsf2-section-label span { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--text-faint); }
  .gsf2-com-list { list-style: none; margin: 0 0 6px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .gsf2-com-item { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; background: var(--panel-2); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; }
  .gsf2-com-time { font-family: var(--mono); font-weight: 800; font-size: 11.5px; color: var(--action); }
  .gsf2-com-txt { flex: 1; min-width: 120px; color: var(--text); }
  .gsf2-com-add { display: flex; gap: 6px; margin-top: 6px; }
  .gsf2-com-input { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; font-family: var(--sans); }
  .gsf2-com-btn { border: none; background: var(--action); color: #fff; font-weight: 800; font-size: 12px; border-radius: 8px; padding: 0 12px; cursor: pointer; }

  .gsf2-photos { margin-top: 4px; }
  .gsf2-photos-thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
  .gsf2-photo-thumb { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .gsf2-photo-thumb img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; display: block; }
  .gsf2-photo-time { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #FFD54A; font-family: var(--mono); font-size: 9.5px; font-weight: 800; text-align: center; padding: 1px 0; pointer-events: none; }
  .gsf2-photo-remove {
    position: absolute; top: 2px; right: 2px; width: 17px; height: 17px; line-height: 15px; padding: 0;
    background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; font-size: 10px; cursor: pointer;
  }
  .gsf2-photo-add {
    width: 60px; height: 60px; border-radius: 8px; border: 1px dashed var(--border); background: var(--panel-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 18px; color: var(--text-dim);
    cursor: pointer; text-align: center; line-height: 1.1; padding: 0; font-family: var(--sans);
  }
  .gsf2-photo-add span { font-size: 10px; font-weight: 800; }
  .gsf2-photo-add:hover { background: var(--hover); }

  /* Caméra en direct + visionneuse */
  .gsf2-cam { position: fixed; inset: 0; z-index: 60; background: rgba(5, 8, 16, .82); display: flex; align-items: center; justify-content: center; padding: 14px; animation: gsf-in .2s ease both; }
  .gsf2-cam-box { background: var(--panel); color: var(--text); border-radius: 16px; width: 100%; max-width: 520px; padding: 14px; box-shadow: var(--shadow); }
  .gsf2-cam-head { font-size: 14px; margin-bottom: 10px; }
  .gsf2-cam-view { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; }
  .gsf2-cam-view video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gsf2-cam-clock { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #FFD54A; font-family: var(--mono); font-weight: 800; font-size: 14px; padding: 6px 10px; }
  .gsf2-cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .gsf2-cam-flash.go { animation: gsf-flash .26s ease-out; }
  @keyframes gsf-flash { 0% { opacity: .9; } 100% { opacity: 0; } }
  .gsf2-cam-msg { font-size: 12px; color: var(--text-dim); margin: 10px 2px; line-height: 1.5; }
  .gsf2-cam-native { margin-top: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-weight: 700; font-size: 12.5px; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .gsf2-cam-actions { display: flex; gap: 8px; }
  .gsf2-cam-cancel { flex: 1; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim); font-weight: 700; border-radius: 10px; padding: 12px; cursor: pointer; font-size: 14px; }
  .gsf2-cam-shoot { flex: 2; border: none; background: var(--action); color: #fff; font-weight: 800; border-radius: 10px; padding: 12px; cursor: pointer; font-size: 15px; }
  .gsf2-cam-shoot:disabled { opacity: .5; cursor: default; }
  .gsf2-viewer img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: var(--shadow); }
  .gsf2-viewer-close { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,.18); color: #fff; font-size: 18px; cursor: pointer; }

  .gsf2-empty { text-align: center; color: var(--text-faint); padding: 50px 20px; font-size: 13.5px; grid-column: 1 / -1; }

  .gsf2-backup { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .gsf2-backup-note { font-size: 11.5px; color: var(--text-faint); flex-basis: 100%; }

  .gsf2-pin-screen { display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
  .gsf2-pin-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 32px 28px; max-width: 300px; width: 100%; text-align: center; }
  .gsf2-pin-icon { font-size: 32px; margin-bottom: 8px; }
  .gsf2-pin-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .gsf2-pin-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 18px; }
  .gsf2-pin-input {
    width: 100%; text-align: center; font-family: var(--mono); font-size: 26px; letter-spacing: 10px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 0; color: var(--text);
  }

  @media (max-width: 640px) {
    .gsf2-toolbar-grid { grid-template-columns: 1fr; }
    .gsf2-header-top { flex-direction: column; align-items: flex-start; }
    .gsf2-tabs { overflow-x: auto; padding: 12px 12px 0; -webkit-overflow-scrolling: touch; }
    .gsf2-tab { flex-shrink: 0; white-space: nowrap; padding-left: 12px; padding-right: 12px; }
  }

  /* ---- Carnet de process ---- */
  .carnet-navy { --cn-ink: #0F3D4C; --cn-navy: #0F3D4C; --cn-red: #C8102E; --cn-reg: #6D28D9; --cn-agent: #0F766E; --cn-pn: #A15C07; --cn-ch: #1D4ED8; }
  .carnet-subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .carnet-subtab {
    font-family: var(--sans); font-size: 12.5px; font-weight: 700; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-dim); padding: 7px 13px; border-radius: 99px; cursor: pointer;
  }
  .carnet-subtab.active { background: var(--cn-navy); border-color: var(--cn-navy); color: #fff; }
  .carnet-section-title { font-family: var(--sans); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--cn-ink); margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
  .carnet-section-title::before { content: ""; width: 16px; height: 4px; background: var(--cn-red); border-radius: 2px; }
  .carnet-section-title:first-child { margin-top: 0; }

  .carnet-num-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .carnet-num-info { flex: 1; min-width: 0; }
  .carnet-num-label { font-size: 11.5px; color: var(--text-dim); font-weight: 600; margin-bottom: 2px; }
  .carnet-num-value { font-family: var(--mono); font-size: 16px; font-weight: 800; color: var(--cn-ink); }
  .carnet-num-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .carnet-btn-call, .carnet-btn-copy {
    font-family: var(--sans); font-size: 12px; font-weight: 700; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 11px; cursor: pointer; background: var(--panel-2); color: var(--text-dim); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  }
  .carnet-btn-call { background: var(--cn-navy); border-color: var(--cn-navy); color: #fff; }
  .carnet-btn-copy.done { background: var(--success-bg); border-color: transparent; color: var(--success); }

  .carnet-fiche { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .carnet-fiche-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .carnet-fiche-num {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px; background: var(--cn-red); color: #fff;
    font-family: var(--mono); font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .carnet-fiche-titre { font-size: 15.5px; font-weight: 800; color: var(--text); }
  .carnet-fiche-resume { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .carnet-fiche-retenir { background: var(--panel-2); border-left: 3px solid var(--cn-ink); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; color: var(--text); margin: 10px 0; }
  .carnet-fiche-retenir b { color: var(--cn-ink); }
  .carnet-partie-titre { font-family: var(--sans); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); margin: 14px 0 8px; display: flex; align-items: center; gap: 6px; }
  .carnet-partie-titre::before { content: ""; width: 12px; height: 3px; background: var(--cn-red); border-radius: 2px; flex-shrink: 0; }
  .carnet-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .carnet-step { display: flex; gap: 10px; align-items: flex-start; background: var(--panel-2); border-radius: 10px; padding: 9px 10px; }
  .carnet-step-no {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; background: var(--cn-navy); color: #fff;
    font-family: var(--mono); font-weight: 800; font-size: 11.5px; display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .carnet-step-txt { font-size: 13.5px; color: var(--text); line-height: 1.4; }
  .carnet-role { display: inline-block; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; margin-right: 6px; }
  .carnet-alert { background: var(--alert-bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--danger-text); margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; }
  .carnet-alert::before { content: "⚠"; flex-shrink: 0; }

  .carnet-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .carnet-list li { display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--text); }
  .carnet-list li .dot { flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px; background: var(--cn-navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }

  .carnet-tenue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .carnet-tenue-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .carnet-tenue-card img { width: 100%; aspect-ratio: 3/4; object-fit: contain; background: #fff; display: block; }
  .carnet-tenue-caption { font-size: 11.5px; color: var(--text-dim); font-weight: 600; padding: 8px 10px; text-align: center; }

  .carnet-contact-group { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 14px 0 8px; }
  .carnet-contact-group:first-child { margin-top: 0; }
  .carnet-person { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .carnet-person-nom { font-size: 13.5px; font-weight: 800; color: var(--text); }
  .carnet-person-fonction { font-size: 11.5px; color: var(--cn-red); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 1px; }
  .carnet-person-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

  .carnet-lexique-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .carnet-lexique-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .carnet-lexique-sigle { font-family: var(--mono); font-weight: 800; font-size: 14px; color: var(--cn-ink); }
  .carnet-lexique-def { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }

  /* ---- Onglet Sûreté ---- */
  .gsf2-tab-surete:not(.active) { color: var(--danger); }
  .sur-root { display: flex; flex-direction: column; gap: 14px; }
  .sur-intro { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--danger); border-radius: 14px; padding: 16px; }
  .sur-intro-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
  .sur-intro ol { margin: 0 0 14px; padding-left: 20px; font-size: 13.5px; line-height: 1.55; color: var(--text); }
  .sur-intro-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .sur-new { flex: 1 1 200px; border: none; border-radius: 12px; background: var(--danger); color: #fff; font-weight: 800; font-size: 16px; padding: 14px; cursor: pointer; }
  .sur-howto { flex: 1 1 160px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel-2); color: var(--text); font-weight: 700; font-size: 13.5px; padding: 12px; cursor: pointer; }
  .sur-sent { display: flex; gap: 12px; align-items: flex-start; background: var(--success-bg); border-radius: 14px; padding: 14px 16px; font-size: 13px; color: var(--text); animation: gsf-in .35s ease both; }
  .sur-sent strong { color: var(--success); font-size: 14.5px; }
  .sur-sent-ico { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--success); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; animation: gsf-pop .5s cubic-bezier(.3,1.5,.5,1); }
  .sur-form { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; animation: gsf-in .3s ease both; }
  .sur-form-title { font-size: 16.5px; font-weight: 800; }
  .sur-form-note { font-size: 12.5px; color: var(--text-dim); margin: 4px 0 6px; line-height: 1.45; }
  .sur-lab { display: block; font-size: 11.5px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; margin: 12px 0 5px; }
  .sur-lab span { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--text-faint); }
  .sur-form select, .sur-form input[type="text"], .sur-form input[type="time"], .sur-form textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 9px;
    padding: 10px 11px; font-size: 14px; font-family: var(--sans);
  }
  .sur-form textarea { resize: vertical; line-height: 1.45; }
  .sur-form select:focus, .sur-form input:focus, .sur-form textarea:focus { outline: 2px solid var(--action); outline-offset: 0; border-color: transparent; }
  .sur-types { display: flex; flex-wrap: wrap; gap: 6px; }
  .sur-type { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; font-family: var(--sans); transition: background-color .2s, border-color .2s, transform .12s; }
  .sur-type:active { transform: scale(.97); }
  .sur-type.on { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 800; }
  .sur-form input.sur-type-autre { margin-top: 8px; animation: gsf-open .2s ease-out both; }
  .sur-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .sur-seg { display: flex; gap: 6px; }
  .sur-seg button { flex: 1; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim); font-weight: 800; font-size: 13px; border-radius: 9px; padding: 10px; cursor: pointer; }
  .sur-seg button.on.majeur { background: var(--danger); border-color: var(--danger); color: #fff; }
  .sur-seg button.on.mineur { background: var(--warning); border-color: var(--warning); color: #241500; }
  .sur-checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .sur-check { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--panel-2); border-radius: 99px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--text-dim); }
  .sur-check input { margin: 0; accent-color: var(--action); }
  .sur-check.on { border-color: var(--action); color: var(--text); }
  .sur-form-err { display: none; margin-top: 12px; background: var(--danger-bg); color: var(--danger-text); font-weight: 700; font-size: 13px; border-radius: 9px; padding: 9px 12px; }
  .sur-form-err.show { display: block; animation: gsf-in .25s ease both; }
  .sur-form-actions { display: flex; gap: 8px; margin-top: 14px; }
  .sur-cancel { flex: 1; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim); font-weight: 700; border-radius: 11px; padding: 13px; cursor: pointer; font-size: 14px; }
  .sur-send { flex: 2; border: none; background: var(--danger); color: #fff; font-weight: 800; border-radius: 11px; padding: 13px; cursor: pointer; font-size: 15px; }
  .sur-send:disabled { opacity: .6; }
  .sur-list-title { font-size: 12px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin: 4px 0 8px; }
  .sur-empty { text-align: center; color: var(--text-faint); font-size: 13px; padding: 18px; background: var(--panel); border: 1px dashed var(--border); border-radius: 12px; }
  .sur-foot { font-size: 11.5px; color: var(--text-faint); margin: 8px 2px 0; }
  .sur-item { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .sur-item-head { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 11px 13px; cursor: pointer; text-align: left; color: var(--text); font-family: var(--sans); }
  .sur-item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .sur-item-main span { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .sur-item.open .gsf2-chevron { transform: rotate(90deg); }
  .sur-item-body { padding: 0 13px 12px; animation: gsf-open .25s ease-out both; }
  .rap-row { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .rap-k { color: var(--text-dim); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; padding-top: 2px; }
  .rap-v { color: var(--text); line-height: 1.45; word-break: break-word; }
  .rap-grav { display: inline-block; flex-shrink: 0; font-weight: 800; font-size: 10.5px; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; }
  .rap-grav.majeur { background: var(--danger); color: #fff; }
  .rap-grav.mineur { background: var(--warning-bg); color: var(--warning); }
  .rap-photos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rap-photos img { width: 110px; height: 82px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
  .sur-reg { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; margin-bottom: 10px; }
  .sur-reg-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sur-reg-row input[type="date"] { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 9px; font-family: var(--sans); font-size: 13px; }
  .sur-reg-row .gsf2-btn:disabled { opacity: .45; cursor: default; }
  .reg-rapports { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--danger); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--text); }
  .carnet-inc-p { font-size: 13.5px; line-height: 1.55; color: var(--text); margin: 0; }
  .carnet-inc-nums { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .carnet-inc-nums > div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .carnet-inc-numlab { font-size: 12px; color: var(--text-dim); }
  .carnet-inc-go { width: 100%; margin-top: 14px; border: none; border-radius: 12px; background: var(--danger); color: #fff; font-weight: 800; font-size: 15px; padding: 13px; cursor: pointer; }
  @media (max-width: 520px) {
    .sur-2col { grid-template-columns: 1fr; }
    .rap-row { grid-template-columns: 1fr; gap: 2px; }
  }

  /* ---- Fond de page + mode sombre ---- */
  html { --page-bg: #FFFFFF; background: var(--page-bg); }
  body { background: var(--page-bg); }
  #gsf2-root { --action: #1E5BD8; --action-hover: #1849B0; }
  html[data-theme="dark"] { --page-bg: #070A14; color-scheme: dark; }
  html[data-theme="dark"] #gsf2-root {
    --bg: #0E1220; --panel: #161B2D; --panel-2: #1C2236; --border: #2A3149;
    --text: #E6E9F2; --text-dim: #A3AAC2; --text-faint: #6E7694;
    --primary: #D63852; --primary-bg: #3A1724; --primary-ink: #FF9AAD;
    --success: #34D399; --success-bg: #0F3328; --warning: #FBBF24; --warning-bg: #3A2C0E;
    --danger: #F87171; --danger-bg: #3A1717; --danger-text: #FFB4B4;
    --hover: #262D45; --bistatut-bg: #2B2410; --bistatut-border: #B88F00; --alert-bg: #3A1820;
    --shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
    --action: #3171E8; --action-hover: #4A84F0;
  }
  html[data-theme="dark"] .carnet-navy {
    --cn-ink: #8FD0E0; --cn-navy: #1F6A80; --cn-red: #E0445F;
    --cn-reg: #B794F6; --cn-agent: #4FD1C5; --cn-pn: #F6AD55; --cn-ch: #7FA8F7;
  }
  html[data-theme="dark"] .gsf2-bistatut-chip.on { color: #2A2000; }
  html[data-theme="dark"] .gsf2-next-btn.overdue { background: #B42335; }
  html[data-theme="dark"] .gsf2-next-btn.overdue:hover { background: #C92B3F; }
  html.theme-anim, html.theme-anim body, html.theme-anim #gsf2-root, html.theme-anim #gsf2-root * {
    transition: background-color .35s ease, color .35s ease, border-color .35s ease !important;
  }
  .gsf2-theme-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2);
    font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    transition: transform .35s cubic-bezier(.3,1.5,.5,1);
  }
  .gsf2-theme-btn.spin { transform: rotate(360deg); }

  /* ---- Jalons : un seul bouton, dans l'ordre ---- */
  .gsf2-step-circle { cursor: default; transition: background-color .25s, border-color .25s, color .25s; }
  .gsf2-step-time.done { color: var(--success); font-weight: 700; }
  .gsf2-step.is-done:not(:last-child)::after { background: var(--success); transition: background-color .3s; }
  .gsf2-next-btn {
    width: 100%; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "step go" "label go" "due go";
    align-items: center; text-align: left; gap: 1px 12px; border: none; border-radius: 12px; padding: 11px 16px;
    margin: 2px 0 10px; background: var(--action); color: #fff; cursor: pointer; font-family: var(--sans);
    transition: transform .12s ease, background-color .2s ease, box-shadow .2s ease;
  }
  .gsf2-next-btn:hover { background: var(--action-hover); box-shadow: var(--shadow); }
  .gsf2-next-btn.soon { background: var(--warning); color: #241500; }
  .gsf2-next-btn.overdue { background: var(--danger); color: #fff; }
  .gsf2-next-btn.soon:hover { background: #E08A0A; }
  .gsf2-next-btn.overdue:hover { background: #C21F1F; }
  .gsf2-next-btn::after { content: "Valider ›"; grid-area: go; font-size: 12.5px; font-weight: 800; background: rgba(255,255,255,.2); padding: 7px 11px; border-radius: 8px; white-space: nowrap; }
  .gsf2-next-step { grid-area: step; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  .gsf2-next-label { grid-area: label; font-size: 16.5px; font-weight: 800; line-height: 1.2; }
  .gsf2-next-due { grid-area: due; font-size: 11px; font-family: var(--mono); opacity: .9; }
  .gsf2-next-done { background: var(--success-bg); color: var(--success); font-weight: 800; border-radius: 10px; padding: 10px 14px; margin: 2px 0 10px; text-align: center; font-size: 13px; }
  .gsf2-validate-what { font-size: 12px; font-weight: 800; color: var(--primary-ink); white-space: nowrap; }
  .gsf2-row-last { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--success); background: var(--success-bg); padding: 1px 6px; border-radius: 6px; white-space: nowrap; }

  .gsf2-fer-info { font-size: 12px; border-radius: 9px; padding: 8px 11px; margin: 0 0 8px; background: var(--panel-2); color: var(--text); border-left: 3px solid var(--action); }
  .gsf2-fer-info strong { font-family: var(--mono); }
  .gsf2-fer-info.hint { color: var(--text-dim); border-left-color: var(--text-faint); }
  .gsf2-fer-info.soon { background: var(--warning-bg); border-left-color: var(--warning); }
  .gsf2-fer-info.overdue { background: var(--danger-bg); border-left-color: var(--danger); color: var(--danger-text); font-weight: 700; }
  .gsf2-row-fer { font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--action); background: var(--panel-2); border: 1px solid var(--border); padding: 0 6px; border-radius: 6px; white-space: nowrap; }
  .gsf2-row-fer.soon { color: var(--warning); border-color: var(--warning); }
  .gsf2-row-fer.overdue { color: #fff; background: var(--danger); border-color: var(--danger); animation: gsf-pulse 2s infinite; --pulse: rgba(220, 38, 38, .5); }
  .gsf2-predef {
    width: 100%; margin: 0; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 9px; font-size: 12.5px; color: var(--text-dim); font-family: var(--sans); cursor: pointer;
  }

  /* ---- Historique ---- */
  .gsf2-hist { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .gsf2-hist-toggle { background: none; border: none; color: var(--text-dim); font-weight: 700; font-size: 12px; cursor: pointer; padding: 4px 0; display: inline-flex; gap: 6px; align-items: center; font-family: var(--sans); }
  .gsf2-hist-toggle:hover { color: var(--text); }
  .gsf2-hist-count { background: var(--panel-2); border: 1px solid var(--border); border-radius: 99px; padding: 0 7px; font-family: var(--mono); font-size: 10.5px; }
  .gsf2-hist-list { list-style: none; margin: 6px 0 2px 4px; padding: 0; border-left: 2px solid var(--border); }
  .gsf2-hist-item { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 4px 0 4px 14px; position: relative; font-size: 12px; color: var(--text); }
  .gsf2-hist-item::before { content: ""; position: absolute; left: -5px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); box-shadow: 0 0 0 2px var(--panel); }
  .gsf2-card.is-bistatut .gsf2-hist-item::before { box-shadow: 0 0 0 2px var(--bistatut-bg); }
  .gsf2-hist-item.type-jalon::before { background: var(--success); }
  .gsf2-hist-item.type-annulation::before { background: var(--danger); }
  .gsf2-hist-item.type-creation::before { background: var(--primary); }
  .gsf2-hist-item.type-commentaire::before { background: var(--action); }
  .gsf2-hist-item.type-photo::before { background: #8B5CF6; }
  .gsf2-hist-item.type-annulation .gsf2-hist-label { color: var(--danger); }
  .gsf2-hist-time { font-family: var(--mono); font-weight: 800; font-size: 11.5px; color: var(--text-dim); }
  .gsf2-hist-label { flex: 1; min-width: 120px; }
  .gsf2-hist-qui { font-size: 11px; color: var(--text-faint); font-style: italic; }
  .gsf2-hist-undo { border: 1px solid var(--danger); background: var(--danger-bg); color: var(--danger); border-radius: 6px; font-size: 10.5px; font-weight: 800; padding: 2px 7px; cursor: pointer; }

  /* ---- Notification ---- */
  .gsf2-toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 50;
    background: var(--text); color: var(--panel); font-weight: 700; font-size: 13px; padding: 11px 18px; border-radius: 12px;
    box-shadow: var(--shadow); max-width: calc(100vw - 32px); transition: opacity .3s ease, transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .gsf2-toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---- Animations ---- */
  @keyframes gsf-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes gsf-open { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes gsf-slide { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  @keyframes gsf-pop { 0% { transform: scale(.5); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes gsf-pulse { 0% { box-shadow: 0 0 0 0 var(--pulse, rgba(30, 91, 216, .45)); } 70% { box-shadow: 0 0 0 7px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
  @keyframes gsf-leave {
    0% { opacity: 1; transform: none; }
    35% { opacity: 1; transform: scale(1.015); background: var(--success-bg); border-color: var(--success); }
    100% { opacity: 0; transform: translateX(40px) scale(.97); background: var(--success-bg); border-color: var(--success); }
  }
  .gsf2-card { transition: box-shadow .2s ease, border-color .2s ease; }

<script>
  // --- Shim "window.storage" branché sur Firebase Realtime Database ---
  // Permet un vrai partage des données entre le régulateur et tous les agents, sur tous les
  // appareils. Les clés "non partagées" (ex. le prénom mémorisé localement) restent en
  // localStorage, propres à chaque navigateur. Si Firebase est injoignable (pas de réseau,
  // configuration invalide...), on retombe automatiquement sur un mode local par navigateur.
  window.storageReady = (async function () {
    const ROOT = "gsf-circuit-arrivee"; // doit correspondre au chemin autorisé dans les règles Firebase

    function localOnlyStorage() {
      window.storage = {
        async get(key) {
          try {
            const raw = localStorage.getItem("gsf_" + key);
            return raw === null ? null : { value: raw };
          } catch (e) { return null; }
        },
        async set(key, value) {
          try { localStorage.setItem("gsf_" + key, value); return true; }
          catch (e) { return false; }
        },
        // Tous les éléments enregistrés sous "key/xxx" (ex. un rapport sûreté par élément)
        async getChildren(key) {
          try {
            const out = [];
            const prefix = "gsf_" + key + "/";
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.indexOf(prefix) === 0) out.push(localStorage.getItem(k));
            }
            return out;
          } catch (e) { return null; }
        }
      };
    }

    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js");
      const { getDatabase, ref, set: fbSet, get: fbGet, onValue } =
        await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js");

      const firebaseConfig = {
        apiKey: "AIzaSyCecCySYlc_kgDafc2u9juDawY7RuUgdy0",
        authDomain: "gsf-circuit-arrivee.firebaseapp.com",
        databaseURL: "https://gsf-circuit-arrivee-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "gsf-circuit-arrivee",
        storageBucket: "gsf-circuit-arrivee.firebasestorage.app",
        messagingSenderId: "37377007617",
        appId: "1:37377007617:web:cd44115fc79a6e0364a000",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      window.storage = {
        async get(key, shared) {
          if (!shared) {
            try {
              const raw = localStorage.getItem("gsf_" + key);
              return raw === null ? null : { value: raw };
            } catch (e) { return null; }
          }
          try {
            const snap = await fbGet(ref(db, ROOT + "/" + key));
            return snap.exists() ? { value: snap.val() } : null;
          } catch (e) { return null; }
        },
        async set(key, value, shared) {
          if (!shared) {
            try { localStorage.setItem("gsf_" + key, value); return true; }
            catch (e) { return false; }
          }
          try { await fbSet(ref(db, ROOT + "/" + key), value); return true; }
          catch (e) { return false; }
        },
        async getChildren(key) {
          try {
            const snap = await fbGet(ref(db, ROOT + "/" + key));
            if (!snap.exists()) return [];
            const v = snap.val();
            return (v && typeof v === "object") ? Object.values(v) : [];
          } catch (e) { return null; }
        }
      };

      // Écoute en temps réel : dès qu'un autre appareil modifie les vols, on les recharge
      // immédiatement ici (sans attendre le prochain rafraîchissement périodique).
      onValue(ref(db, ROOT + "/flights"), () => {
        if (typeof window.onRemoteFlightsChange === "function") window.onRemoteFlightsChange();
      });
    } catch (e) {
      localOnlyStorage();
    }
  })();
</script>

  const CARNET_ROLE_COLORS = { "Régulateur": "var(--cn-reg)", "Agent": "var(--cn-agent)", "Équipage": "var(--cn-pn)", "Chauffeur": "var(--cn-ch)" };
  let carnetSubTab = "numeros";

  const bodyEl = document.getElementById("gsf2-body");
  const statsEl = document.getElementById("gsf2-stats");
  const clockEl = document.getElementById("gsf2-clock");

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function escHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function parseTimeToday(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
  }
  function addMinutes(date, mins) { return new Date(date.getTime() + mins * 60000); }
  function fmtHHMM(date) { return pad(date.getHours()) + ":" + pad(date.getMinutes()); }

  function effectiveBloc(flight) { return flight.heureBlocReel || flight.heureBloc; }

  function computeDeadline(flight, key) {
    const bloc = parseTimeToday(effectiveBloc(flight));
    const j = JALONS[key];
    if (j.needsPorteur) {
      const off = flight.biStatut ? 20 : (flight.porteur === "LC" ? 30 : 15);
      return addMinutes(bloc, off);
    }
    return addMinutes(bloc, j.offset || 0);
  }

  function fmtCountdown(flight, key) {
    const now = new Date();
    const dl = computeDeadline(flight, key);
    let diffMs = dl.getTime() - now.getTime();
    const overdue = diffMs < 0;
    const soon = !overdue && diffMs < 5 * 60000;
    diffMs = Math.abs(diffMs);
    const totalMin = Math.floor(diffMs / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    const str = (h > 0 ? h + "h" : "") + pad(m);
    return { str: (overdue ? "+" : "-") + str, overdue, soon };
  }

  function detectPorteur(vol) {
    const m = (vol || "").match(/\d+/);
    if (!m) return "MC";
    return m[0].length <= 3 ? "LC" : "MC";
  }

  function expandParkingCode(token) {
    const m = token.match(/^([A-Za-z]+)(\d+)\/(\d+)$/);
    if (m) return [(m[1] + m[2]).toUpperCase(), (m[1] + m[3]).toUpperCase(), token.toUpperCase()];
    return [token.toUpperCase()];
  }
  function buildParkingIndex(porte) {
    const index = {};
    const text = gateMapping[porte] || "";
    text.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
      const eq = line.indexOf("=");
      if (eq === -1) return;
      const parkingPart = line.slice(0, eq).trim();
      const gatePart = line.slice(eq + 1).trim();
      if (!parkingPart || !gatePart) return;
      expandParkingCode(parkingPart).forEach(code => { index[code] = gatePart; });
    });
    return index;
  }
  function deriveGateInfo(parking) {
    const parkClean = (parking || "").toUpperCase().trim();
    if (!parkClean) return null;
    for (const g of GATES) {
      const index = buildParkingIndex(g);
      if (index[parkClean]) return { porte: g, gate: index[parkClean] };
    }
    return null;
  }

  function pushFlight(vol, parking, bloc, porteur, porte, gate, biStatut, provenance) {
    flights.push({
      id: uid(), vol, porte, gate, parking, heureBloc: bloc, porteur, biStatut: !!biStatut, provenance: provenance || null,
      pax: null,
      jalons: {
        ouverture: { done: false, doneAt: null, qui: null },
        mise_en_place: { done: false, doneAt: null, qui: null },
        go_debarquement: { done: false, doneAt: null, qui: null, forced: false },
        ascenseur_verifie: { done: false, doneAt: null, qui: null },
        confirmation_pn: { done: false, doneAt: null, qui: null },
        fermeture: { done: false, doneAt: null, qui: null },
      },
      commentaire: "", commentaires: [], photos: [], creeLe: Date.now(), majLe: Date.now(),
      historique: [{ id: uid(), at: Date.now(), type: "creation", label: "Vol ajouté", qui: monPrenom || null }],
    });
  }

  function parseTokens(rawTokens) {
    const tokens = rawTokens.slice();
    let explicitGate = null;
    for (let i = 0; i < tokens.length; i++) {
      if (/^[KLM]$/i.test(tokens[i].trim())) {
        explicitGate = tokens[i].trim().toUpperCase();
        tokens.splice(i, 1);
        break;
      }
    }
    return { tokens, explicitGate };
  }

  // Détection et extraction du format brut ASTRID (liste de vols CDG),
  // dont on ne garde que : n° de vol, parking, heure réelle.
  function isAstridLine(line) {
    const times = line.match(/\b\d{1,2}:\d{2}\b/g) || [];
    return /\bAF\d/i.test(line) && times.length >= 2;
  }

  function parseAstridLine(line) {
    const volMatch = line.match(/\bAF\d[\dA-Z\/]*\b/i);
    if (!volMatch) return null;
    const vol = volMatch[0].toUpperCase();

    const times = line.match(/\b\d{1,2}:\d{2}\b/g) || [];
    let heureReelle = null;
    if (times.length >= 2) heureReelle = times[1];
    else if (times.length === 1) heureReelle = times[0];
    if (heureReelle) {
      const [h, m] = heureReelle.split(":");
      heureReelle = h.padStart(2, "0") + ":" + m;
    }

    const tokens = line.trim().split(/\s+/);
    const volIdx = tokens.findIndex(t => /^AF\d/i.test(t));
    let parking = null;
    let provenance = null;
    if (volIdx !== -1) {
      for (let i = volIdx + 3; i < tokens.length; i++) {
        if (!parking && /^[A-Z]{1,2}\d{1,3}$/.test(tokens[i].toUpperCase())) {
          parking = tokens[i].toUpperCase();
          continue;
        }
        if (!provenance && /^[A-Z]{3}$/.test(tokens[i])) {
          provenance = tokens[i].toUpperCase();
        }
        if (parking && provenance) break;
      }
    }
    // NAVETTE (bus) : token "true"/"false" isolé, ailleurs sur la ligne
    const biStatut = /\btrue\b/i.test(line);
    return { vol, parking, heureReelle, biStatut, provenance };
  }

  // Ajoute les champs manquants sur les vols enregistrés avant l'ajout d'une fonctionnalité
  // (jalons "ascenseur vérifié" / "confirmation PN", nombre de pax, photos), pour ne jamais planter
  // sur d'anciennes données déjà sauvegardées.
  function normalizeFlight(f) {
    if (!f.jalons) f.jalons = {};
    JALON_KEYS.forEach(k => {
      if (!f.jalons[k]) f.jalons[k] = { done: false, doneAt: null, qui: null };
    });
    if (f.jalons.go_debarquement.forced === undefined) f.jalons.go_debarquement.forced = false;
    if (f.pax === undefined) f.pax = null;
    if (!Array.isArray(f.photos)) f.photos = [];
    if (!Array.isArray(f.commentaires)) {
      // Ancien commentaire libre (sans heure) : on le garde comme un commentaire daté de la dernière mise à jour.
      f.commentaires = (f.commentaire && f.commentaire.trim())
        ? [{ id: uid(), at: f.majLe || f.creeLe || Date.now(), texte: f.commentaire.trim(), qui: null }]
        : [];
    }
    if (!Array.isArray(f.historique)) {
      // Vol enregistré avant l'historique : on le reconstruit à partir de ce qu'on sait déjà.
      const h = [];
      if (f.creeLe) h.push({ id: uid(), at: f.creeLe, type: "creation", label: "Vol ajouté", qui: null });
      JALON_KEYS.forEach(k => {
        const j = f.jalons[k];
        if (j.done && j.doneAt) h.push({ id: uid(), at: j.doneAt, type: "jalon", key: k, label: JALONS[k].label, qui: j.qui || null });
      });
      h.sort((a, b) => a.at - b.at);
      f.historique = h;
    }
    return f;
  }

  // ---- Historique par vol ----
  function addHistory(f, type, label, extra) {
    if (!Array.isArray(f.historique)) f.historique = [];
    f.historique.push(Object.assign({ id: uid(), at: Date.now(), type, label, qui: monPrenom || null }, extra || {}));
  }

  // Jalons dans l'ordre : le prochain à valider est le premier non fait.
  function nextJalonKey(f) {
    return JALON_KEYS.find(k => !f.jalons[k].done) || null;
  }
  function lastDoneJalonKey(f) {
    for (let i = JALON_KEYS.length - 1; i >= 0; i--) {
      if (f.jalons[JALON_KEYS[i]].done) return JALON_KEYS[i];
    }
    return null;
  }

  let storageHealthy = true;

  async function checkStorage() {
    const el = document.getElementById("gsf2-storage-status");
    if (!el) return false;
    try {
      if (!window.storage || typeof window.storage.set !== "function") {
        storageHealthy = false;
        el.innerHTML = "⚠ Mode local — la sauvegarde partagée n'est pas disponible ici. Vos vols restent visibles sur cet écran, mais ne sont ni partagés ni conservés après fermeture. <strong>Pensez à exporter une sauvegarde régulièrement.</strong>";
        el.style.color = "var(--danger)";
        return false;
      }
      const testVal = String(Date.now());
      const setResult = await window.storage.set("gsf-storage-test", testVal, true);
      if (!setResult) throw new Error("set a échoué");
      const getResult = await window.storage.get("gsf-storage-test", true);
      if (!getResult || getResult.value !== testVal) throw new Error("incohérent");
      storageHealthy = true;
      el.textContent = "● Sauvegarde active — partagée entre régulateur et agents";
      el.style.color = "var(--success)";
      return true;
    } catch (e) {
      storageHealthy = false;
      el.innerHTML = "⚠ Mode local — sauvegarde partagée momentanément indisponible. Vos vols restent visibles sur cet écran. <strong>Pensez à exporter une sauvegarde.</strong>";
      el.style.color = "var(--danger)";
      return false;
    }
  }

  let lastFlightsSaveAt = 0;

  async function saveFlights() {
    try {
      const ok = !!(await window.storage.set("flights", JSON.stringify(flights), true));
      if (ok) lastFlightsSaveAt = Date.now();
      return ok;
    } catch (e) { return false; }
  }
  async function saveGateMapping() {
    try { return !!(await window.storage.set("gate-mapping", JSON.stringify(gateMapping), true)); }
    catch (e) { return false; }
  }
  async function saveMonPrenom() {
    try { await window.storage.set("mon-prenom", JSON.stringify(monPrenom), false); }
    catch (e) { /* ignore */ }
  }

  let flightsLoadedOnce = false;
  let gateMappingLoadedOnce = false;

  async function load() {
    if (window.storageReady) await window.storageReady;
    const healthy = await checkStorage();
    if (!healthy) {
      // Mode local : on ne touche pas aux données déjà en mémoire, on continue avec elles.
      if (!flightsLoadedOnce) flights = flights || [];
      if (!gateMappingLoadedOnce) gateMapping = { ...DEFAULT_GATE_MAPPING };
      render();
      return;
    }
    const recentLocalSave = Date.now() - lastFlightsSaveAt < 4000;
    if (!recentLocalSave) {
      try {
        const f = await window.storage.get("flights", true);
        flights = f ? JSON.parse(f.value).map(normalizeFlight) : [];
        flightsLoadedOnce = true;
      } catch (e) {
        if (!flightsLoadedOnce) flights = [];
        // sinon : échec transitoire, on garde les vols déjà affichés au lieu de les effacer
      }
    }
    try {
      const g = await window.storage.get("gate-mapping", true);
      gateMapping = g ? JSON.parse(g.value) : { ...DEFAULT_GATE_MAPPING };
      gateMappingLoadedOnce = true;
      if (!g) await saveGateMapping();
    } catch (e) {
      if (!gateMappingLoadedOnce) {
        gateMapping = { ...DEFAULT_GATE_MAPPING };
        await saveGateMapping();
      }
    }
    try {
      const p = await window.storage.get("mon-prenom", false);
      monPrenom = p ? JSON.parse(p.value) : "";
    } catch (e) { /* garder la valeur déjà en mémoire */ }
    try {
      const pin = await window.storage.get("regulateur-pin", true);
      regulateurPin = pin ? JSON.parse(pin.value) : DEFAULT_REGULATEUR_PIN;
      if (!pin) await saveRegulateurPin();
    } catch (e) {
      // garder le code déjà en mémoire (par défaut au premier chargement)
    }
    render();
  }

  async function saveRegulateurPin() {
    try { return !!(await window.storage.set("regulateur-pin", JSON.stringify(regulateurPin), true)); }
    catch (e) { return false; }
  }

  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } catch (e) { /* pas de son dispo */ }
  }

  function updateAlert() {
    const banner = document.getElementById("gsf2-alert");
    if (!banner) return;
    const open = flights.filter(f => !f.jalons.fermeture.done);
    const overdue = open.filter(f => fmtCountdown(f, "fermeture").overdue);
    const soon = open.filter(f => fmtCountdown(f, "fermeture").soon);
    // Une alerte "dans 5 min" puis une alerte "c'est l'heure", une seule fois chacune par vol.
    const newDue = overdue.filter(f => !alertedIds.has(f.id + ":due"));
    const newSoon = soon.filter(f => !alertedIds.has(f.id + ":soon"));
    newDue.forEach(f => { alertedIds.add(f.id + ":due"); alertedIds.add(f.id + ":soon"); });
    newSoon.forEach(f => alertedIds.add(f.id + ":soon"));
    if (newDue.length) {
      beep(); setTimeout(beep, 450); setTimeout(beep, 900);
      try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) { /* ignore */ }
      showToast("⏰ Fermeture du circuit maintenant : " + newDue.map(f => `${f.vol} (${fermetureRule(f)})`).join(", "));
    } else if (newSoon.length) {
      beep();
      try { if (navigator.vibrate) navigator.vibrate(250); } catch (e) { /* ignore */ }
      showToast("⏳ Fermeture dans 5 min : " + newSoon.map(f => `${f.vol} à ${fmtHHMM(computeDeadline(f, "fermeture"))}`).join(", "));
    }
    flights.forEach(f => {
      if (f.jalons.fermeture.done) { alertedIds.delete(f.id + ":soon"); alertedIds.delete(f.id + ":due"); }
    });
    const toAlert = [...overdue, ...soon];
    if (toAlert.length === 0) { banner.classList.remove("show"); banner.innerHTML = ""; return; }
    banner.classList.add("show");
    banner.innerHTML = "⚠ Fermeture à effectuer : " + toAlert.map(f =>
      `<strong>${escHtml(f.vol)} (${escHtml(f.gate || f.porte || "?")}) ${fmtHHMM(computeDeadline(f, "fermeture"))}</strong>`).join(", ");
  }

  const lastStatVals = {};
  function renderStats() {
    let total = 0, done = 0, overdue = 0;
    flights.forEach(f => {
      JALON_KEYS.forEach(k => {
        total++;
        if (f.jalons[k].done) { done++; return; }
        if (fmtCountdown(f, k).overdue) overdue++;
      });
    });
    const items = [
      { label: "Vols suivis", val: flights.length },
      { label: "Jalons restants", val: total - done },
      { label: "Jalons validés", val: done },
      { label: "En retard", val: overdue },
    ];
    statsEl.innerHTML = items.map(it => {
      // Petit "rebond" du chiffre seulement quand il change.
      const changed = lastStatVals[it.label] !== undefined && lastStatVals[it.label] !== it.val;
      lastStatVals[it.label] = it.val;
      return `
      <div class="gsf2-stat">
        <div class="gsf2-stat-num ${changed ? "bump" : ""}" style="color:${it.label === "En retard" && it.val > 0 ? "var(--danger)" : "var(--text)"}">${it.val}</div>
        <div class="gsf2-stat-label">${it.label}</div>
      </div>
    `;
    }).join("");
  }

  function render() {
    renderStats();
    updateAlert();
    if (activeTab === "regulateur") renderRegulateur();
    else if (activeTab === "effectues") renderEffectues();
    else if (activeTab === "carnet") renderCarnet();
    else if (activeTab === "surete") {
      // On ne reconstruit pas le formulaire pendant qu'un agent écrit : seule la liste se met à jour.
      if (document.getElementById("sur-root") && !animateNextRender) { refreshRapportsSoon(); renderSureteList(); }
      else { renderSurete(); refreshRapportsSoon(true); }
    }
    else renderAgent();
    // Animation d'entrée uniquement quand on change d'onglet (pas aux rafraîchissements automatiques).
    if (animateNextRender) {
      animateNextRender = false;
      bodyEl.classList.remove("anim-enter");
      void bodyEl.offsetWidth;
      bodyEl.classList.add("anim-enter");
      setTimeout(() => bodyEl.classList.remove("anim-enter"), 700);
    }
  }

  function renderCurrentGrid() {
    if (activeTab === "regulateur") renderRegGrid();
    else if (activeTab === "effectues") renderEffectuesGrid();
    else if (activeTab === "agent") renderAgentGrid();
    renderStats();
    updateAlert();
  }

  function gateSelectOptionsAll(selected) {
    let html = `<option value="toutes" ${selected === "toutes" ? "selected" : ""}>Toutes les portes</option>`;
    html += `<option value="non_assignees" ${selected === "non_assignees" ? "selected" : ""}>Non assignées</option>`;
    html += GATES.map(g => `<option value="${g}" ${g === selected ? "selected" : ""}>Porte ${g}</option>`).join("");
    return html;
  }

  function fermetureRule(f) {
    if (f.biStatut) return "H+20 bi-statut";
    return f.porteur === "LC" ? "H+30 LC" : "H+15 MC";
  }

  function blocReelHtml(flight) {
    if (flight.heureBlocReel) {
      return `<button class="gsf2-blocreel-done" data-blocreel-id="${flight.id}" title="Re-pointer le bloc">🛬 Bloc ${flight.heureBlocReel} ✔</button>`;
    }
    return `<button class="gsf2-blocreel-btn" data-blocreel-id="${flight.id}">🛬 Pointer le bloc avion</button>`;
  }

  // Bandeau "fermeture à HH:MM" calculé depuis l'heure où l'agent a pointé le bloc.
  function fermetureInfoHtml(f) {
    if (f.jalons.fermeture.done) return "";
    if (!f.heureBlocReel) {
      return `<div class="gsf2-fer-info hint">🛬 Pointez le bloc avion dès qu'il est au contact : l'alerte de fermeture se règle sur cette heure (${fermetureRule(f)}).</div>`;
    }
    const cd = fmtCountdown(f, "fermeture");
    const at = fmtHHMM(computeDeadline(f, "fermeture"));
    const raw = cd.str.slice(1);
    const dur = raw.includes("h") ? raw : String(parseInt(raw, 10)) + " min";
    const cls = cd.overdue ? "overdue" : (cd.soon ? "soon" : "");
    const txt = cd.overdue ? `dépassée de ${dur}` : `dans ${dur}`;
    return `<div class="gsf2-fer-info ${cls}">⏰ Fermeture du circuit à <strong>${at}</strong> (${fermetureRule(f)}, bloc ${f.heureBlocReel}) · ${txt}</div>`;
  }

  function isFlightDone(flight) {
    return JALON_KEYS.every(k => flight.jalons[k].done);
  }

  function stepCircleClass(flight, key) {
    const j = flight.jalons[key];
    if (j.done) return "done";
    const cd = fmtCountdown(flight, key);
    if (cd.overdue) return "overdue";
    if (cd.soon) return "soon";
    return "";
  }

  let pendingValidation = null; // { flightId, key }
  let expandedFlights = new Set(); // ids des vols dépliés (affichage jalons)
  let historyOpen = new Set();     // ids des vols dont l'historique est affiché
  // Animations : on ne les joue qu'au bon moment, jamais à chaque rafraîchissement automatique.
  const seenFlightIds = new Set();
  let justToggledId = null;
  let justOpenedHistId = null;
  let justValidated = null;        // { id, key, at }
  let animateNextRender = false;

  const PREDEF_COMMENTS = [
    "APMR en retard",
    "PN empruntant le circuit pax",
    "Problème passerelle",
    "RZA en retard",
  ];

  function stepperHtml(flight) {
    const nextKey = nextJalonKey(flight);
    return `
      <div class="gsf2-stepper">
        ${JALON_KEYS.map(key => {
          const j = flight.jalons[key];
          const cls = stepCircleClass(flight, key);
          const dl = computeDeadline(flight, key);
          const timeLabel = j.done ? (j.doneAt ? fmtHHMM(new Date(j.doneAt)) : "✔") : fmtHHMM(dl);
          const isJust = justValidated && justValidated.id === flight.id && justValidated.key === key && Date.now() - justValidated.at < 2000;
          return `
            <div class="gsf2-step ${j.done ? "is-done" : ""}">
              <div class="gsf2-step-circle ${cls} ${key === nextKey ? "next" : ""} ${isJust ? "just-done" : ""}" title="${JALONS[key].label}${j.qui ? " · " + escHtml(j.qui) : ""}">
                ${j.done ? "✔" : JALON_KEYS.indexOf(key) + 1}
              </div>
              <div class="gsf2-step-label">${JALONS[key].short}</div>
              <div class="gsf2-step-time ${j.done ? "done" : ""}">${timeLabel}</div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  // Un seul bouton : le prochain jalon. Une fois validé il disparaît et laisse la place au suivant.
  function nextJalonHtml(f) {
    const key = nextJalonKey(f);
    if (!key) {
      const fer = f.jalons.fermeture;
      return `<div class="gsf2-next-done">✔ Circuit fermé${fer.doneAt ? " à " + fmtHHMM(new Date(fer.doneAt)) : ""}</div>`;
    }
    if (pendingValidation && pendingValidation.flightId === f.id) {
      return `
        <div class="gsf2-validate-box">
          <span class="gsf2-validate-what">${JALONS[pendingValidation.key].label}</span>
          <input id="gsf2-qui-input" type="text" placeholder="Votre prénom" value="${escHtml(monPrenom || "")}" autofocus />
          <button class="gsf2-validate-confirm" data-confirm-validation="1">✔ Valider</button>
          <button class="gsf2-validate-cancel" data-cancel-validation="1">✕</button>
        </div>
      `;
    }
    const cls = stepCircleClass(f, key);
    const cd = fmtCountdown(f, key);
    const dl = fmtHHMM(computeDeadline(f, key));
    const raw = cd.str.slice(1);
    const dur = raw.includes("h") ? raw : String(parseInt(raw, 10)) + " min";
    const due = cd.overdue ? `Prévu ${dl} · en retard de ${dur}` : `Prévu ${dl} · dans ${dur}`;
    const isFresh = justValidated && justValidated.id === f.id && Date.now() - justValidated.at < 2000;
    return `
      <button class="gsf2-next-btn ${cls} ${isFresh ? "fresh" : ""}" data-next-id="${f.id}" data-next-key="${key}">
        <span class="gsf2-next-step">Étape ${JALON_KEYS.indexOf(key) + 1}/${JALON_KEYS.length}</span>
        <span class="gsf2-next-label">${JALONS[key].label}</span>
        <span class="gsf2-next-due">${due}</span>
      </button>
    `;
  }

  function historyHtml(f) {
    const hist = (f.historique || []).slice().sort((a, b) => a.at - b.at);
    const open = historyOpen.has(f.id);
    const lastKey = lastDoneJalonKey(f);
    let undoEntryId = null;
    if (regulateurUnlocked && lastKey) {
      for (let i = hist.length - 1; i >= 0; i--) {
        if (hist[i].type === "jalon" && hist[i].key === lastKey) { undoEntryId = hist[i].id; break; }
      }
    }
    return `
      <div class="gsf2-hist">
        <button class="gsf2-hist-toggle ${open ? "open" : ""}" data-hist-id="${f.id}">🕓 ${open ? "Cacher" : "Voir"} l'historique <span class="gsf2-hist-count">${hist.length}</span></button>
        ${open ? `
          <ol class="gsf2-hist-list ${justOpenedHistId === f.id ? "anim-open" : ""}">
            ${hist.length === 0 ? `<li class="gsf2-hist-item"><span class="gsf2-hist-label" style="color:var(--text-faint)">Aucun événement</span></li>` : ""}
            ${hist.map(h => `
              <li class="gsf2-hist-item type-${h.type}">
                <span class="gsf2-hist-time">${fmtHHMM(new Date(h.at))}</span>
                <span class="gsf2-hist-label">${escHtml(h.label)}</span>
                ${h.qui ? `<span class="gsf2-hist-qui">${escHtml(h.qui)}</span>` : ""}
                ${h.id === undoEntryId ? `<button class="gsf2-hist-undo" data-undo-id="${f.id}" title="Annuler ce jalon (régulateur)">✕ Annuler</button>` : ""}
              </li>
            `).join("")}
          </ol>
        ` : ""}
      </div>
    `;
  }

  let toastTimer = null;
  function showToast(msg) {
    let el = document.getElementById("gsf2-toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "gsf2-toast";
      el.className = "gsf2-toast";
      document.getElementById("gsf2-root").appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function cardHtml(f, opts, idx) {
    const allDone = JALON_KEYS.every(k => f.jalons[k].done);
    const doneCount = JALON_KEYS.filter(k => f.jalons[k].done).length;
    const gateLabel = f.porte ? (f.gate || f.porte) : "?";
    const expanded = expandedFlights.has(f.id);
    const isNew = !seenFlightIds.has(f.id);
    const lastKey = lastDoneJalonKey(f);
    const lastJ = lastKey ? f.jalons[lastKey] : null;
    const animCls = (isNew ? "anim-in" : "") + (justToggledId === f.id && expanded ? " anim-open" : "");
    const animStyle = isNew ? `style="animation-delay:${Math.min(idx || 0, 12) * 35}ms"` : "";
    return `
      <div class="gsf2-card ${allDone ? "is-complete" : ""} ${f.biStatut ? "is-bistatut" : ""} ${expanded ? "is-expanded" : ""} ${opts.showDelete ? "has-delete" : ""} ${animCls}" data-card-id="${f.id}" ${animStyle}>
        ${opts.showDelete ? `<button class="gsf2-card-delete" data-delete-id="${f.id}" title="Annuler ce vol">✕</button>` : ""}
        <div class="gsf2-card-row" data-toggle-id="${f.id}">
          <div class="gsf2-card-row-main">
            <span class="gsf2-card-vol">${f.vol}</span>
            ${f.porte
              ? `<span class="gsf2-card-gate">${gateLabel}</span>`
              : `<select class="gsf2-card-gate unassigned" data-gate-fix-id="${f.id}" style="border:1px solid var(--danger); font-family:var(--mono); font-weight:800;"><option value="">?</option>${GATES.map(g => `<option value="${g}">${g}</option>`).join("")}</select>`}
            <span class="gsf2-card-row-meta">Bloc ${f.heureBloc} · ${f.porteur || "MC"}${f.provenance ? " · " + f.provenance : ""}</span>
            ${f.biStatut ? `<span class="gsf2-card-row-bus" title="Bi statut (bus)">🚌</span>` : ""}
          </div>
          <div class="gsf2-card-row-right">
            ${f.heureBlocReel && !allDone ? (() => { const cd = fmtCountdown(f, "fermeture"); return `<span class="gsf2-row-fer ${cd.overdue ? "overdue" : (cd.soon ? "soon" : "")}" title="Fermeture (${fermetureRule(f)})">⏰ ${fmtHHMM(computeDeadline(f, "fermeture"))}</span>`; })() : ""}
            ${lastJ && !allDone ? `<span class="gsf2-row-last" title="Dernier jalon validé">${JALONS[lastKey].short} ${lastJ.doneAt ? fmtHHMM(new Date(lastJ.doneAt)) : "✔"}</span>` : ""}
            <span class="gsf2-progress-text ${allDone ? "all-done" : ""}">${allDone ? "✔ Terminé" : doneCount + "/" + JALON_KEYS.length}</span>
            <span class="gsf2-chevron">▸</span>
          </div>
        </div>
        <div class="gsf2-card-body" ${expanded ? "" : 'style="display:none;"'}>
          <div class="gsf2-card-meta">
            <span>Bloc ${f.heureBloc}</span>
            <span class="sep">·</span>
            <span>${f.porteur || "MC"}</span>
            ${f.provenance ? `<span class="sep">·</span><span>Prov. ${f.provenance}</span>` : ""}
            <span class="sep">·</span>
            ${blocReelHtml(f)}
          </div>
          ${stepperHtml(f)}
          ${fermetureInfoHtml(f)}
          ${nextJalonHtml(f)}
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <span class="gsf2-bistatut-chip ${f.biStatut ? "on" : ""}" data-bistatut-id="${f.id}" title="Vol avec navette bus : fermeture à H+20">🚌 ${f.biStatut ? "BI STATUT" : "Bi statut ?"}</span>
            ${f.jalons.go_debarquement.forced ? `<span class="gsf2-forced-chip on" data-forced-id="${f.id}">⚠ GO forcé</span>` : `<span class="gsf2-forced-chip" data-forced-id="${f.id}">GO forcé ?</span>`}
            ${f.biStatut ? `
              <span style="display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--text-dim); font-weight:700;">
                Pax :
                <input type="number" min="0" class="gsf2-pax-input" data-pax-id="${f.id}" value="${f.pax !== null && f.pax !== undefined ? f.pax : ""}" placeholder="—" style="width:52px; font-family:var(--mono); font-size:11.5px; background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:3px 6px; color:var(--text);" />
              </span>
            ` : ""}
          </div>
          <div class="gsf2-coms">
            <div class="gsf2-section-label">💬 Commentaires</div>
            ${(f.commentaires || []).length ? `
              <ul class="gsf2-com-list">
                ${f.commentaires.slice().sort((a, b) => a.at - b.at).map(c => `
                  <li class="gsf2-com-item">
                    <span class="gsf2-com-time">${fmtHHMM(new Date(c.at))}</span>
                    <span class="gsf2-com-txt">${escHtml(c.texte)}</span>
                    ${c.qui ? `<span class="gsf2-hist-qui">${escHtml(c.qui)}</span>` : ""}
                  </li>
                `).join("")}
              </ul>
            ` : ""}
            <select class="gsf2-predef" data-predef-id="${f.id}">
              <option value="">＋ Commentaire prédéfini…</option>
              ${PREDEF_COMMENTS.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join("")}
            </select>
            <div class="gsf2-com-add">
              <input type="text" class="gsf2-com-input" data-com-input-id="${f.id}" placeholder="Autre commentaire…" maxlength="300" />
              <button class="gsf2-com-btn" data-com-add-id="${f.id}">Ajouter</button>
            </div>
          </div>
          <div class="gsf2-photos">
            <div class="gsf2-section-label">📷 Photos <span>(prises en direct, horodatées)</span></div>

                <div class="gsf2-photo-thumb">
                  <img src="${p.dataUrl}" data-photo-view="${p.id}" data-photo-flight="${f.id}" alt="Photo ${p.takenAt ? fmtHHMM(new Date(p.takenAt)) : ""}" />
                  ${p.takenAt || p.addedAt ? `<span class="gsf2-photo-time">${fmtHHMM(new Date(p.takenAt || p.addedAt))}</span>` : ""}
                  ${regulateurUnlocked ? `<button class="gsf2-photo-remove" data-photo-remove-flight="${f.id}" data-photo-remove-id="${p.id}" title="Supprimer la photo (régulateur)">✕</button>` : ""}
                </div>
              `).join("")}
              <button class="gsf2-photo-add" data-camera-id="${f.id}" title="Prendre une photo maintenant">📷<span>Prendre</span></button>
