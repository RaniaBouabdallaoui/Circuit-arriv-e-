  function gridHtml(list, opts) {
    if (list.length === 0) return `<div class="gsf2-empty">Aucun vol pour cette sélection.</div>`;
    list.sort((a, b) => parseTimeToday(a.heureBloc) - parseTimeToday(b.heureBloc));
    let newIdx = 0;
    const html = list.map(f => cardHtml(f, opts, seenFlightIds.has(f.id) ? 0 : newIdx++)).join("");
    list.forEach(f => seenFlightIds.add(f.id));
    justToggledId = null;
    justOpenedHistId = null;
    return html;
  }

  function attachCardEvents(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll("[data-toggle-id]").forEach(row => {
      row.addEventListener("click", (e) => {
        if (e.target.closest("select, button, input, a")) return;
        const id = row.getAttribute("data-toggle-id");
        if (expandedFlights.has(id)) expandedFlights.delete(id);
        else { expandedFlights.add(id); justToggledId = id; }
        renderCurrentGrid();
      });
    });
    container.querySelectorAll("[data-gate-fix-id]").forEach(sel => {
      sel.addEventListener("change", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-gate-fix-id"));
        if (!flight) return;
        flight.porte = e.currentTarget.value || null;
        flight.majLe = Date.now();
        if (flight.porte) addHistory(flight, "porte", "Porte assignée : " + flight.porte);
        render();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-blocreel-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-blocreel-id"));
        if (!flight) return;
        const now = new Date();
        const hhmm = pad(now.getHours()) + ":" + pad(now.getMinutes());
        if (flight.heureBlocReel && !confirm(`Bloc déjà pointé à ${flight.heureBlocReel}. Le re-pointer à ${hhmm} ?`)) return;
        flight.heureBlocReel = hhmm;
        flight.blocReelAt = now.getTime();
        flight.majLe = Date.now();
        // Nouvelle heure de bloc = nouvelle heure de fermeture : on réarme les alertes de ce vol.
        alertedIds.delete(flight.id + ":soon");
        alertedIds.delete(flight.id + ":due");
        const fer = fmtHHMM(computeDeadline(flight, "fermeture"));
        addHistory(flight, "bloc", `Bloc avion pointé à ${hhmm} → fermeture ${fer} (${fermetureRule(flight)})`);
        showToast(`🛬 ${flight.vol} au bloc ${hhmm} — fermeture à ${fer} (${fermetureRule(flight)})`);
        renderCurrentGrid();
        saveFlights();
      });
    });
    // Prochain jalon : on ne peut valider que celui-là, dans l'ordre.
    container.querySelectorAll("[data-next-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const id = e.currentTarget.getAttribute("data-next-id");
        const flight = flights.find(f => f.id === id);
        if (!flight) return;
        const key = nextJalonKey(flight);
        if (!key) return;
        pendingValidation = { flightId: id, key };
        renderCurrentGrid();
        const input = document.getElementById("gsf2-qui-input");
        if (input) { input.focus(); input.select(); }
      });
    });
    const confirmValidation = () => {
      if (!pendingValidation) return;
      const { flightId, key } = pendingValidation;
      const flight = flights.find(f => f.id === flightId);
      const input = document.getElementById("gsf2-qui-input");
      const qui = input ? input.value.trim() : "";
      pendingValidation = null;
      // Si quelqu'un d'autre l'a déjà validé entre-temps, on ne revalide pas.
      if (!flight || flight.jalons[key].done || nextJalonKey(flight) !== key) { renderCurrentGrid(); return; }
      const j = flight.jalons[key];
      j.done = true;
      j.doneAt = Date.now();
      j.qui = qui || null;
      flight.majLe = Date.now();
      if (qui) { monPrenom = qui; saveMonPrenom(); }
      addHistory(flight, "jalon", JALONS[key].label, { key, qui: qui || null });
      justValidated = { id: flight.id, key, at: Date.now() };
      saveFlights();
      if (isFlightDone(flight) && activeTab !== "effectues") {
        // Vol terminé : petite animation de sortie, puis il passe dans "Vols effectués".
        const cardEl = document.querySelector(`[data-card-id="${flight.id}"]`);
        if (cardEl) cardEl.classList.add("is-leaving");
        showToast(`✔ ${flight.vol} terminé — rangé dans "Vols effectués"`);
        setTimeout(renderCurrentGrid, cardEl ? 650 : 0);
      } else {
        renderCurrentGrid();
      }
    };
    container.querySelectorAll("[data-confirm-validation]").forEach(btn => {
      btn.addEventListener("click", confirmValidation);
    });
    const quiInput = container.querySelector("#gsf2-qui-input");
    if (quiInput) {
      quiInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); confirmValidation(); }
        if (e.key === "Escape") { pendingValidation = null; renderCurrentGrid(); }
      });
    }
    container.querySelectorAll("[data-cancel-validation]").forEach(btn => {
      btn.addEventListener("click", () => {
        pendingValidation = null;
        renderCurrentGrid();
      });
    });
    // Annulation du dernier jalon : réservée au régulateur (code d'accès déverrouillé).
    container.querySelectorAll("[data-undo-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        if (!regulateurUnlocked) return;
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-undo-id"));
        if (!flight) return;
        const key = lastDoneJalonKey(flight);
        if (!key) return;
        if (!confirm(`Annuler le jalon "${JALONS[key].label}" du vol ${flight.vol} ?`)) return;
        const j = flight.jalons[key];
        j.done = false; j.doneAt = null; j.qui = null;
        flight.majLe = Date.now();
        addHistory(flight, "annulation", "Jalon annulé : " + JALONS[key].label);
        renderCurrentGrid();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-hist-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const id = e.currentTarget.getAttribute("data-hist-id");
        if (historyOpen.has(id)) historyOpen.delete(id); else { historyOpen.add(id); justOpenedHistId = id; }
        renderCurrentGrid();
      });
    });
    container.querySelectorAll("[data-predef-id]").forEach(sel => {
      sel.addEventListener("change", (e) => {
        const val = e.currentTarget.value;
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-predef-id"));
        if (!flight || !val) return;
        addComment(flight, val);
      });
    });
    // Commentaire libre : chaque ajout est horodaté (heure + prénom), on ne réécrit pas les anciens.
    const submitComment = (id) => {
      const input = container.querySelector(`[data-com-input-id="${id}"]`);
      const flight = flights.find(f => f.id === id);
      const txt = input ? input.value.trim() : "";
      if (!flight || !txt) { if (input) input.focus(); return; }
      addComment(flight, txt);
    };
    container.querySelectorAll("[data-com-add-id]").forEach(btn => {
      btn.addEventListener("click", (e) => submitComment(e.currentTarget.getAttribute("data-com-add-id")));
    });
    container.querySelectorAll("[data-com-input-id]").forEach(input => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); submitComment(input.getAttribute("data-com-input-id")); }
      });
    });
    container.querySelectorAll("[data-camera-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-camera-id"));
        if (flight) openCamera(flight);
      });
    });
    container.querySelectorAll("[data-forced-id]").forEach(chip => {
      chip.addEventListener("click", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-forced-id"));
        if (!flight) return;
        flight.jalons.go_debarquement.forced = !flight.jalons.go_debarquement.forced;
        flight.majLe = Date.now();
        addHistory(flight, "info", flight.jalons.go_debarquement.forced ? "GO forcé activé" : "GO forcé retiré");
        renderCurrentGrid();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-bistatut-id]").forEach(chip => {
      chip.addEventListener("click", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-bistatut-id"));
        if (!flight) return;
        flight.biStatut = !flight.biStatut;
        flight.majLe = Date.now();
        addHistory(flight, "info", flight.biStatut ? "Bi-statut (bus) activé" : "Bi-statut (bus) retiré");
        renderCurrentGrid();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-delete-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        if (!confirm("Annuler ce vol et ses jalons ?")) return;
        flights = flights.filter(f => f.id !== e.currentTarget.getAttribute("data-delete-id"));
        render();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-pax-id]").forEach(input => {
      let timer = null;
      input.addEventListener("input", () => {
        const id = input.getAttribute("data-pax-id");
        clearTimeout(timer);
        timer = setTimeout(() => {
          const flight = flights.find(f => f.id === id);
          if (!flight) return;
          const v = input.value.trim();
          flight.pax = v === "" ? null : Math.max(0, parseInt(v, 10) || 0);
          flight.majLe = Date.now();
          saveFlights();
        }, 500);
      });
      input.addEventListener("change", () => {
        const flight = flights.find(f => f.id === input.getAttribute("data-pax-id"));
        if (!flight) return;
        const v = input.value.trim();
        flight.pax = v === "" ? null : Math.max(0, parseInt(v, 10) || 0);
        addHistory(flight, "info", flight.pax === null ? "Nombre de pax effacé" : "Nombre de pax : " + flight.pax);
        saveFlights();
      });
    });
    container.querySelectorAll("[data-photo-remove-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const flightId = e.currentTarget.getAttribute("data-photo-remove-flight");
        const photoId = e.currentTarget.getAttribute("data-photo-remove-id");
        const flight = flights.find(f => f.id === flightId);
        if (!flight || !regulateurUnlocked) return;
        if (!confirm("Supprimer cette photo ?")) return;
        flight.photos = (flight.photos || []).filter(p => p.id !== photoId);
        flight.majLe = Date.now();
        addHistory(flight, "photo", "Photo supprimée");
        renderCurrentGrid();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-photo-view]").forEach(img => {
      img.addEventListener("click", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-photo-flight"));
        const photo = flight && (flight.photos || []).find(p => p.id === e.currentTarget.getAttribute("data-photo-view"));
        if (photo) openPhotoViewer(photo.dataUrl);
      });
    });
  }

  // ---- Commentaires horodatés ----
  function addComment(flight, texte) {
    const now = Date.now();
    if (!Array.isArray(flight.commentaires)) flight.commentaires = [];
    flight.commentaires.push({ id: uid(), at: now, texte, qui: monPrenom || null });
    flight.majLe = now;
    addHistory(flight, "commentaire", "Commentaire : " + texte);
    renderCurrentGrid();
    saveFlights();
  }

  // ---- Photos prises en direct, avec l'heure incrustée dans l'image ----
  const PHOTO_MAX_W = 960;
  const PHOTO_MAX_AGE_MS = 3 * 60000; // repli "appareil photo du téléphone" : photo prise il y a moins de 3 min
  let cameraStream = null;
  let cameraClockTimer = null;

  function fmtDateTimeFull(d) {
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " +
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  function stampImage(ctx, w, h, flight, takenAt) {
    const fs = Math.max(15, Math.round(w * 0.034));
    const bandH = Math.round(fs * 2.9);
    const x = Math.round(fs * 0.6);
    const where = flight.gate || flight.porte;
    const line1 = flight.stampLine1 || (flight.vol + (where ? " · Porte " + where : "") + (flight.parking ? " · Parking " + flight.parking : ""));
    const who = flight.stampAgent || monPrenom;
    const line2 = fmtDateTimeFull(takenAt) + (who ? " · " + who : "");
    ctx.fillStyle = "rgba(0, 0, 0, 0.62)";
    ctx.fillRect(0, h - bandH, w, bandH);
    ctx.textBaseline = "top";
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "700 " + fs + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText(line1, x, h - bandH + Math.round(fs * 0.32));
    ctx.fillStyle = "#FFD54A";
    ctx.font = "700 " + Math.round(fs * 0.92) + "px 'SF Mono', Consolas, monospace";
    ctx.fillText(line2, x, h - bandH + Math.round(fs * 1.55));
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.font = "800 " + Math.round(fs * 0.8) + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("GSF · CDG", w - x, h - bandH + Math.round(fs * 0.36));
    ctx.textAlign = "left";
  }

  // Dessine une image/vidéo source dans un canvas réduit, incruste le tampon, renvoie le JPEG.
  function captureStamped(source, srcW, srcH, flight, takenAt) {
    const scale = Math.min(1, PHOTO_MAX_W / srcW);
    const w = Math.round(srcW * scale);
    const h = Math.round(srcH * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(source, 0, 0, w, h);
    stampImage(ctx, w, h, flight, takenAt);
    return canvas.toDataURL("image/jpeg", 0.7);
  }

  async function savePhoto(flightRef, dataUrl, takenAt) {
    // La liste a pu être rechargée pendant que la caméra était ouverte : on repart du vol à jour.
    const flight = flights.find(f => f.id === flightRef.id);
    if (!flight) { alert("Ce vol n'existe plus, photo non enregistrée."); return; }
    flight.photos = flight.photos || [];
    flight.photos.push({ id: uid(), dataUrl, addedAt: Date.now(), takenAt: takenAt.getTime(), qui: monPrenom || null, live: true });
    flight.majLe = Date.now();
    addHistory(flight, "photo", "Photo prise (" + fmtHHMM(takenAt) + ")");
    renderCurrentGrid();
    showToast("📷 Photo enregistrée — " + flight.vol + " à " + fmtHHMM(takenAt));
    const ok = await saveFlights();
    if (!ok) alert("⚠ La photo n'a pas pu être sauvegardée (espace de stockage insuffisant). Réessayez.");
  }

  function closeCamera() {
    if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
    clearInterval(cameraClockTimer);
    const el = document.getElementById("gsf2-cam");
    if (el) el.remove();
    document.removeEventListener("keydown", cameraEscHandler);
  }
  function cameraEscHandler(e) { if (e.key === "Escape") closeCamera(); }

  // Repli : appareil photo natif du téléphone (capture="environment").
  // On refuse une image qui n'a pas été prise à l'instant (photo de la galerie).
  function nativeCameraFallback(flight, onCaptured) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.setAttribute("capture", "environment");
    input.style.display = "none";
    document.body.appendChild(input);
    input.addEventListener("change", () => {
      const file = input.files && input.files[0];
      input.remove();
      if (!file) return;
      const age = Date.now() - (file.lastModified || 0);
      if (!file.lastModified || age > PHOTO_MAX_AGE_MS || age < -60000) {
        alert("Photo refusée : seules les photos prises à l'instant sont acceptées (pas de photo de la galerie).");
        return;
      }
      const takenAt = new Date(Math.min(file.lastModified, Date.now()));
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const dataUrl = captureStamped(img, img.width, img.height, flight, takenAt);
          if (onCaptured) onCaptured(dataUrl, takenAt); else savePhoto(flight, dataUrl, takenAt);
        };
        img.onerror = () => alert("Photo illisible, réessayez.");
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
    input.click();
  }

  async function openCamera(flight, onCaptured) {
    closeCamera();
    const overlay = document.createElement("div");
    overlay.id = "gsf2-cam";
    overlay.className = "gsf2-cam";
    overlay.innerHTML = `
      <div class="gsf2-cam-box">
        <div class="gsf2-cam-head"><strong>${escHtml(flight.vol)}</strong> · photo en direct</div>
        <div class="gsf2-cam-view">
          <video playsinline muted autoplay></video>
          <div class="gsf2-cam-clock"></div>
          <div class="gsf2-cam-flash"></div>
        </div>
        <div class="gsf2-cam-msg">Ouverture de la caméra…</div>
        <div class="gsf2-cam-actions">
          <button class="gsf2-cam-cancel" type="button">Annuler</button>

    const clock = overlay.querySelector(".gsf2-cam-clock");

    tick();
    cameraClockTimer = setInterval(tick, 1000);
    overlay.querySelector(".gsf2-cam-cancel").addEventListener("click", closeCamera);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCamera(); });

    const offerFallback = (why) => {
      msg.innerHTML = `${why}<br><button class="gsf2-cam-native" type="button">Ouvrir l'appareil photo du téléphone</button>`;
      msg.querySelector(".gsf2-cam-native").addEventListener("click", () => { closeCamera(); nativeCameraFallback(flight, onCaptured); });
    };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      offerFallback("La caméra en direct n'est pas disponible sur ce navigateur.");
      return;
    }
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } },
        audio: false,
      });
    } catch (err) {
      offerFallback("Caméra non autorisée. Autorisez l'accès à la caméra pour ce site, ou :");
      return;
    }
    if (!document.getElementById("gsf2-cam")) { closeCamera(); return; } // fermé entre-temps
    video.srcObject = cameraStream;
    const ready = () => { msg.textContent = "L'heure ci-dessus sera incrustée dans la photo."; shoot.disabled = false; };
    if (video.readyState >= 1) ready(); else video.addEventListener("loadedmetadata", ready, { once: true });
    shoot.addEventListener("click", async () => {
      if (!video.videoWidth) return;
      shoot.disabled = true;
      const takenAt = new Date();
      const dataUrl = captureStamped(video, video.videoWidth, video.videoHeight, flight, takenAt);
      overlay.querySelector(".gsf2-cam-flash").classList.add("go");
      setTimeout(() => { closeCamera(); if (onCaptured) onCaptured(dataUrl, takenAt); else savePhoto(flight, dataUrl, takenAt); }, 260);
    });

      let pdfjsLib;
      try {
        pdfjsLib = await loadPdfJs();
      } catch (err) {
        statusEl.textContent = "⚠ Le lecteur PDF n'a pas pu être chargé (connexion internet ?). Copiez-collez le texte à la place.";

        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        let fullText = "";
        for (let p = 1; p <= pdf.numPages; p++) {
          const page = await pdf.getPage(p);
          const content = await page.getTextContent();
          // Regrouper les items par ligne (même position Y approximative)
          const lineMap = new Map();
          content.items.forEach(item => {
            const y = Math.round(item.transform[5]);
            if (!lineMap.has(y)) lineMap.set(y, []);
            lineMap.get(y).push(item);
          });
          const sortedY = Array.from(lineMap.keys()).sort((a, b) => b - a);
          sortedY.forEach(y => {
            const itemsOnLine = lineMap.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
            fullText += itemsOnLine.map(i => i.str).join(" ").replace(/\s+/g, " ").trim() + "\n";
          });

        document.getElementById("bulk-input").value = fullText.trim();
        statusEl.textContent = `✓ PDF lu (${pdf.numPages} page(s)). Vérifiez ci-dessous puis cliquez sur "Importer la liste".`;

      } catch (err) {
        statusEl.textContent = "⚠ Impossible de lire ce PDF. Essayez de copier-coller le texte à la place.";

      }

    document.getElementById("html-import-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];

      if (!file) return;
      statusEl.textContent = "Lecture de la page FlightViz en cours…";
      statusEl.style.color = "var(--text-dim)";
      try {
        const text = await file.text();
        const doc = new DOMParser().parseFromString(text, "text/html");
        const table = doc.querySelector("table");
        if (!table) throw new Error("no table");
        const rows = Array.from(table.querySelectorAll("tr")).slice(1); // sans l'en-tête

        const results = [];
        let skippedNoDhc = 0;
        let skippedJ1 = 0;
        rows.forEach(r => {
          // On ignore toute ligne qui indique le lendemain (J+1), sous quelque forme que ce soit
          // ("J+1", "+1", un badge de date différente...) : seuls les vols du jour sont importés.
          const rowText = (r.textContent || "");
          if (/\bJ\s*\+\s*1\b/i.test(rowText)) { skippedJ1++; return; }

          const cells = r.querySelectorAll("td");
          if (cells.length < 10) return;

          const dhcCell = cells[5].cloneNode(true);
          const dropdown = dhcCell.querySelector("surveillance-dropdown");
          if (dropdown) dropdown.remove();
          const dhcTxt = (dhcCell.textContent || "").trim();
          const dhcMatch = dhcTxt.match(/\d{1,2}:\d{2}/);
          if (!dhcMatch) { skippedNoDhc++; return; }
          const dhc = dhcMatch[0];

          const volTxt = (cells[6].textContent || "").trim();
          const volMatch = volTxt.match(/AF\s?\d+[A-Z]?(?:\/\d+)?/i);
          if (!volMatch) return;
          const vol = volMatch[0].replace(/\s+/g, "").toUpperCase();

          const prov = (cells[7].textContent || "").trim().toUpperCase();
          const parkg = (cells[8].textContent || "").trim().toUpperCase();
          // Icône bus : cellule juste à droite du parking (cells[9]), détectée de façon large
          // (classe, titre ou libellé contenant "bus"/"navette").
          const busCell = cells[9];
          const busIcon = busCell.querySelector("svg, i, img, [class*='bus' i], [class*='navette' i], [title*='bus' i], [title*='navette' i], [aria-label*='bus' i]");
          const busText = /\bbus\b|\bnavette\b/i.test((busCell.textContent || ""));

          const line = [vol, parkg, dhc, prov];
          if (busIcon || busText) line.push("BUS");
          results.push(line.join("\t"));
        });

        if (results.length === 0) {
          statusEl.textContent = "⚠ Aucun vol avec heure réelle (DHC) trouvé dans ce fichier. Vérifiez que c'est bien la page FlightViz enregistrée complète.";
          statusEl.style.color = "var(--danger)";
        } else {
          document.getElementById("bulk-input").value = results.join("\n");
          statusEl.textContent = `✓ ${results.length} vol(s) lu(s) directement depuis la page (${skippedNoDhc} sans heure réelle ignorés, ${skippedJ1} vol(s) du lendemain (J+1) ignorés). Vérifiez puis cliquez sur "Importer la liste".`;
          statusEl.style.color = "var(--success)";
        }
      } catch (err) {
        statusEl.textContent = "⚠ Impossible de lire ce fichier. Vérifiez que c'est bien un .html enregistré depuis FlightViz (page web complète).";
        statusEl.style.color = "var(--danger)";
      }
      e.target.value = "";

    document.getElementById("mf-submit").addEventListener("click", async () => {
      const resultEl = document.getElementById("mf-result");
      const vol = document.getElementById("mf-vol").value.trim().toUpperCase();
      const parking = document.getElementById("mf-parking").value.trim().toUpperCase();
      const bloc = document.getElementById("mf-bloc").value;
      const porteurSel = document.getElementById("mf-porteur").value;
      const provenance = document.getElementById("mf-provenance").value.trim().toUpperCase() || null;
      const biStatut = document.getElementById("mf-bistatut").checked;

      const porteur = porteurSel || detectPorteur(vol);
      const gateInfo = parking ? deriveGateInfo(parking) : null;
      const porte = gateInfo ? gateInfo.porte : null;
      const gate = gateInfo ? gateInfo.gate : null;

      pushFlight(vol, parking, bloc, porteur, porte, gate, biStatut, provenance);
      const ok = await saveFlights();
      filterGateReg = "toutes";

      document.getElementById("mf-vol").value = "";

      render();
      const finalResultEl = document.getElementById("mf-result");
      if (finalResultEl) {
        let msg = `✓ Vol ${vol} ajouté.`;
        if (parking && !porte) msg += ` <span style="color:var(--danger);">Porte non déduite pour "${parking}" — à assigner manuellement.</span>`;
        if (!ok) msg += ` <span style="color:var(--danger);">⚠ Mode local : sauvegarde partagée indisponible.</span>`;
        finalResultEl.innerHTML = msg;
      }
    });

    document.getElementById("bulk-submit").addEventListener("click", async () => {
      const raw = document.getElementById("bulk-input").value;
      const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
      let added = 0;
      const errors = [];
      const astridMode = lines.some(isAstridLine);

      function splitLine(line) {
        let parts = line.split(/\t|;|,/).map(p => p.trim()).filter(p => p !== "");
        if (parts.length >= 3) return parts;
        parts = line.split(/\s{2,}/).map(p => p.trim()).filter(p => p !== "");
        if (parts.length >= 3) return parts;
        return line.split(/\s+/).map(p => p.trim()).filter(p => p !== "");
      }
      function normalizeBloc(raw) {
        const s = (raw || "").trim();
        let m = s.match(/^(\d{1,2})[:h.hH](\d{2})/);
        if (m) return m[1].padStart(2, "0") + ":" + m[2];
        m = s.match(/^(\d{2})(\d{2})$/);
        if (m) return m[1] + ":" + m[2];
        return null;
      }

      if (astridMode) {
        lines.forEach((line, idx) => {
          const parsed = parseAstridLine(line);
          if (!parsed) return; // ligne d'en-tête, de filtre ou de pied de page : ignorée silencieusement
          const { vol, parking, heureReelle, biStatut, provenance } = parsed;
          if (!heureReelle) { errors.push(`Ligne ${idx + 1} : heure réelle introuvable → "${line}"`); return; }
          const porteur = detectPorteur(vol);
          const gateInfo = parking ? deriveGateInfo(parking) : null;
          const porte = gateInfo ? gateInfo.porte : null;
          const gate = gateInfo ? gateInfo.gate : null;
          pushFlight(vol, parking, heureReelle, porteur, porte, gate, biStatut, provenance);
          added++;
          if (parking && !porte) errors.push(`Ligne ${idx + 1} : porte non déduite pour "${parking}" (${vol}) — à assigner manuellement.`);
          if (!parking) errors.push(`Ligne ${idx + 1} : pas de parking pour ${vol} (probablement annulé) — porte à assigner manuellement si besoin.`);
        });
      } else {
        lines.forEach((line, idx) => {
          const rawParts = splitLine(line);
          const { tokens: parts, explicitGate } = parseTokens(rawParts);
          if (parts.length < 3) { errors.push(`Ligne ${idx + 1} : pas assez d'informations → "${line}"`); return; }
          const [volRaw, parkingRaw, blocRaw, ...rest] = parts;
          const vol = (volRaw || "").toUpperCase();
          const parking = (parkingRaw || "").toUpperCase();
          const bloc = normalizeBloc(blocRaw);
          let porteurRaw = null, provenance = null, biStatut = false;
          rest.forEach(tok => {
            const up = (tok || "").toUpperCase();
            if (/^(MC|LC)$/.test(up)) porteurRaw = up;
            else if (/^BUS$/.test(up)) biStatut = true;
            else if (/^[A-Z]{3}$/.test(up)) provenance = up;
          });
          const porteur = porteurRaw || detectPorteur(vol);
          const gateInfo = deriveGateInfo(parking);
          const porte = explicitGate || (gateInfo ? gateInfo.porte : null);
          const gate = explicitGate ? explicitGate : (gateInfo ? gateInfo.gate : null);

          if (!vol) { errors.push(`Ligne ${idx + 1} : numéro de vol manquant → "${line}"`); return; }
          if (!bloc) { errors.push(`Ligne ${idx + 1} : heure de bloc illisible → "${line}"`); return; }

          pushFlight(vol, parking, bloc, porteur, porte, gate, biStatut, provenance);
          added++;
          if (!porte) errors.push(`Ligne ${idx + 1} : porte non déduite pour "${parking}" — à assigner manuellement.`);
        });
      }

      let msg = `${added} vol(s) ajouté(s)${astridMode ? " (format ASTRID détecté automatiquement)" : ""}.`;
      if (errors.length) msg += `<br/>` + errors.map(e => `<span style="color:var(--text-dim); font-size:11px;">• ${e}</span>`).join("<br/>");
      if (added > 0) {
        const ok = await saveFlights();
        filterGateReg = "toutes";
        if (!ok) msg += `<br/><span style="color:var(--danger);">⚠ Mode local : sauvegarde partagée indisponible, mais les vols restent affichés ici. Pensez à exporter.</span>`;
        document.getElementById("bulk-input").value = "";
      }
      render();
      const finalResultEl = document.getElementById("bulk-result");
      if (finalResultEl) finalResultEl.innerHTML = msg;
    });

    function exportCsv(filenamePrefix) {
      const headers = [
        "N° vol", "Porte", "Gate", "Parking", "Heure bloc", "Heure réelle bloc", "Porteur", "Bi statut (bus)", "Nombre de pax (bi statut)",
        "Ouverture", "Qui (ouverture)",
        "Mise en place", "Qui (mise en place)",
        "GO débarquement", "Qui (GO)", "GO forcé",
        "Ascenseur vérifié", "Qui (ascenseur)",
        "Confirmation PN", "Qui (confirmation PN)",
        "Fermeture", "Qui (fermeture)",
        "Nombre de photos",
        "Commentaires (horodatés)",
        "Historique",
      ];
      function esc(v) {
        const s = (v === null || v === undefined) ? "" : String(v);
        return `"${s.replace(/"/g, '""')}"`;
      }
      const rows = flights.slice()
        .sort((a, b) => parseTimeToday(a.heureBloc) - parseTimeToday(b.heureBloc))
        .map(f => {
          const j = f.jalons;
          const t = (key) => j[key].doneAt ? fmtHHMM(new Date(j[key].doneAt)) : "";
          return [
            f.vol, f.porte || "", f.gate || "", f.parking || "", f.heureBloc, f.heureBlocReel || "", f.porteur || "", f.biStatut ? "OUI" : "", f.pax !== null && f.pax !== undefined ? f.pax : "",
            t("ouverture"), j.ouverture.qui || "",
            t("mise_en_place"), j.mise_en_place.qui || "",
            t("go_debarquement"), j.go_debarquement.qui || "", j.go_debarquement.forced ? "OUI" : "",
            t("ascenseur_verifie"), j.ascenseur_verifie.qui || "",
            t("confirmation_pn"), j.confirmation_pn.qui || "",
            t("fermeture"), j.fermeture.qui || "",
            (f.photos || []).length,
            (f.commentaires || []).slice().sort((a, b) => a.at - b.at)
              .map(c => fmtHHMM(new Date(c.at)) + " " + c.texte + (c.qui ? " (" + c.qui + ")" : "")).join(" | "),
            (f.historique || []).slice().sort((a, b) => a.at - b.at)
              .map(h => fmtHHMM(new Date(h.at)) + " " + h.label + (h.qui ? " (" + h.qui + ")" : "")).join(" | "),
          ].map(esc).join(";");
        });
      const csv = "\uFEFF" + [headers.map(esc).join(";"), ...rows].join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${filenamePrefix}-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById("btn-export-csv").addEventListener("click", () => {
      exportCsv("vols-circuit-arrivee");
    });

    document.getElementById("btn-voir-rapports").addEventListener("click", () => gotoRapport(false));
    if (Date.now() - rapportsLoadedAt > 60000) loadRapports().then(updateRegRapportsInfo); else updateRegRapportsInfo();

    document.getElementById("btn-fin-vac").addEventListener("click", async () => {
      await loadRapports();
      const vacRapports = rapports.filter(r => r.createdAt > lastFinVacAt);
      if (flights.length === 0 && vacRapports.length === 0) {
        alert("Aucun vol ni rapport à exporter.");
        return;
      }
      if (!confirm(`Fin de vacation :\n• ${flights.length} vol(s) exportés en Excel/CSV puis retirés de la liste\n• ${vacRapports.length} rapport(s) sûreté exportés (ils restent consultables)\nContinuer ?`)) return;
      if (flights.length) exportCsv("fin-de-vac");
      if (vacRapports.length) {
        // Petit délai : certains navigateurs bloquent deux téléchargements simultanés.
        await new Promise(res => setTimeout(res, 500));
        exportRapportsHtml(vacRapports, "Fin de vacation du " + fmtDayFr(dayKey(Date.now())), "rapports-surete-fin-de-vac-" + dayKey(Date.now()));
      }
      const now = Date.now();
      try { await window.storage.set("derniere-fin-vac", JSON.stringify(now), true); lastFinVacAt = now; } catch (e) { /* ignore */ }
      flights = [];
      await saveFlights();
      render();
      alert(`Export terminé : ${vacRapports.length ? vacRapports.length + " rapport(s) sûreté et " : ""}la liste des vols a été vidée. Bonne fin de journée !`);
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      const data = { exportedAt: new Date().toISOString(), flights };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `gsf-sauvegarde-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    document.getElementById("btn-import").addEventListener("click", () => document.getElementById("file-import").click());
    document.getElementById("file-import").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const restored = Array.isArray(parsed) ? parsed : parsed.flights;
          if (!Array.isArray(restored)) throw new Error("format invalide");
          if (!confirm(`Restaurer ${restored.length} vol(s) ?`)) return;
          flights = restored.map(normalizeFlight);
          await saveFlights();
          render();
        } catch (err) { alert("Fichier de sauvegarde illisible."); }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    renderRegGrid();
  }

          document.body.appendChild(ta);

  const INCIDENT_TYPES = [
    "Objet suspect / bagage abandonné",

    "Personne sans badge ou badge non valide",
    "Porte ou accès en dysfonctionnement (platine, alarme, plot)",

  let rapports = [];
  let rapportsLoadedAt = 0;
  let rapportsLoading = null;
  let rapportDraft = null;     // formulaire en cours : survit aux rafraîchissements automatiques
  let rapportSent = null;      // dernier rapport envoyé depuis cet appareil
  let rapportSending = false;
  const openRapportIds = new Set();
  let lastFinVacAt = 0;

  function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fmtDayFr(key) { const [y, m, d] = key.split("-"); return d + "/" + m + "/" + y; }

  function loadRapports() {
    if (rapportsLoading) return rapportsLoading;
    rapportsLoading = (async () => {
      try {
        if (window.storageReady) await window.storageReady;
        if (!window.storage || typeof window.storage.getChildren !== "function") return;
        const list = await window.storage.getChildren("rapports-surete");
        if (list) {
          rapports = list.map(v => { try { return typeof v === "string" ? JSON.parse(v) : v; } catch (e) { return null; } })
            .filter(r => r && r.id).sort((a, b) => b.createdAt - a.createdAt);
        }
        const fv = await window.storage.get("derniere-fin-vac", true);
        lastFinVacAt = fv ? (Number(JSON.parse(fv.value)) || 0) : 0;
        rapportsLoadedAt = Date.now();
      } catch (e) { /* on garde ce qu'on a */ }
      finally { rapportsLoading = null; }
    })();
    return rapportsLoading;
  }
  function refreshRapportsSoon(force) {
    if (!force && Date.now() - rapportsLoadedAt < 20000) return;
    loadRapports().then(() => { if (activeTab === "surete") renderSureteList(); updateRegRapportsInfo(); });

        ${rapportDraft ? sureteFormHtml(rapportDraft) : `

  function renderSureteList() {
    const el = document.getElementById("sur-list");
    if (!el) return;
    let html = "";
    if (regulateurUnlocked) {
      const day = rapportDay || dayKey(Date.now());
      const ofDay = rapports.filter(r => dayKey(r.createdAt) === day);
      const sinceVac = rapports.filter(r => r.createdAt > lastFinVacAt);
      html = `
        <div class="sur-reg">
          <div class="sur-list-title">Rapports — vue régulateur</div>
          <div class="sur-reg-row">
            <input type="date" id="sur-day" value="${day}" />
            <button class="gsf2-btn gsf2-btn-sm" id="sur-export-day" ${ofDay.length ? "" : "disabled"}>📄 Exporter ce jour (${ofDay.length})</button>
            <button class="gsf2-btn gsf2-btn-ghost gsf2-btn-sm" id="sur-export-vac" ${sinceVac.length ? "" : "disabled"}>Depuis la dernière fin de vacation (${sinceVac.length})</button>
          </div>
        </div>
        ${ofDay.length ? ofDay.map(rapportItemHtml).join("") : `<div class="sur-empty">Aucun rapport le ${fmtDayFr(day)}.</div>`}`;
    } else {
      const recent = rapports.filter(r => Date.now() - r.createdAt < 24 * 3600000);
      html = `
        <div class="sur-list-title">Rapports des dernières 24 h (${recent.length})</div>
        ${recent.length ? recent.map(rapportItemHtml).join("") : `<div class="sur-empty">Aucun rapport ces dernières 24 h.</div>`}
        <p class="sur-foot">Le régulateur voit l'ensemble des rapports et les extrait avec la fin de vacation.</p>`;
    }
    el.innerHTML = html;
    el.querySelectorAll("[data-rap-toggle]").forEach(b => b.addEventListener("click", () => {
      const id = b.getAttribute("data-rap-toggle");
      if (openRapportIds.has(id)) openRapportIds.delete(id); else openRapportIds.add(id);
      renderSureteList();
    }));
    el.querySelectorAll("img[data-rap-photo]").forEach(img => img.addEventListener("click", () => openPhotoViewer(img.src)));
    const dayInput = el.querySelector("#sur-day");
    if (dayInput) dayInput.addEventListener("change", () => { rapportDay = dayInput.value || null; renderSureteList(); });
    const exDay = el.querySelector("#sur-export-day");
    if (exDay) exDay.addEventListener("click", () => {
      const day = rapportDay || dayKey(Date.now());
      exportRapportsHtml(rapports.filter(r => dayKey(r.createdAt) === day), "Journée du " + fmtDayFr(day), "rapports-surete-" + day);
    });
    const exVac = el.querySelector("#sur-export-vac");
    if (exVac) exVac.addEventListener("click", () => {
      exportRapportsHtml(rapports.filter(r => r.createdAt > lastFinVacAt), "Depuis la dernière fin de vacation", "rapports-surete-vacation-" + dayKey(Date.now()));
    });
  }

  function attachSureteFormEvents() {
    const root = document.getElementById("sur-root");
    if (!root) return;
    const nb = root.querySelector("[data-rf-new]");
    if (nb) nb.addEventListener("click", () => { rapportDraft = newRapportDraft(); rapportSent = null; renderSurete(); });
    const hb = root.querySelector("[data-rf-howto]");
    if (hb) hb.addEventListener("click", () => {
      carnetSubTab = "incident"; activeTab = "carnet";
      document.querySelectorAll(".gsf2-tab").forEach(t => t.classList.toggle("active", t.getAttribute("data-tab") === "carnet"));
      animateNextRender = true; render();
    });
    root.querySelectorAll("img[data-rap-photo]").forEach(img => img.addEventListener("click", () => openPhotoViewer(img.src)));
    if (!rapportDraft) return;
    const d = rapportDraft;
    root.querySelectorAll("[data-rf]").forEach(el => {
      const ev = (el.tagName === "SELECT" || el.type === "time") ? "change" : "input";
      el.addEventListener(ev, () => {
        const k = el.getAttribute("data-rf");
        d[k] = el.value;
        if (k === "volId" && el.value && !d.lieu) {
          const f = flights.find(x => x.id === el.value);
          if (f && (f.gate || f.porte)) { d.lieu = "Porte " + (f.gate || f.porte); const li = root.querySelector('[data-rf="lieu"]'); if (li) li.value = d.lieu; }
        }
      });
    });
    // Menu "Type" : si "Autre", on ouvre un champ pour écrire le type soi-même.
    const typeSel = root.querySelector('select[data-rf="type"]');
    if (typeSel) typeSel.addEventListener("change", () => {
      d.type = typeSel.value;
      const autre = root.querySelector(".sur-type-autre");
      if (autre) {
        autre.style.display = d.type === "Autre" ? "" : "none";
        if (d.type === "Autre") autre.focus();
      }
    });
    root.querySelectorAll("[data-rf-grav]").forEach(b => b.addEventListener("click", () => {
      d.gravite = b.getAttribute("data-rf-grav");
      root.querySelectorAll("[data-rf-grav]").forEach(x => { const g = x.getAttribute("data-rf-grav"); x.className = d.gravite === g ? "on " + graviteCls(g) : ""; });
    }));
    root.querySelectorAll("[data-rf-prev]").forEach(cb => cb.addEventListener("change", () => {
      const v = cb.getAttribute("data-rf-prev");
      d.prevenus = d.prevenus.filter(x => x !== v);
      if (cb.checked) d.prevenus.push(v);
      cb.parentElement.classList.toggle("on", cb.checked);
      if (v === "Régulateur GSF" && cb.checked && !d.heureRegulateur) {
        d.heureRegulateur = fmtHHMM(new Date());
        const hr = root.querySelector('[data-rf="heureRegulateur"]'); if (hr) hr.value = d.heureRegulateur;
      }
    }));
    const pb = root.querySelector("[data-rf-photo]");
    if (pb) pb.addEventListener("click", () => {
      const f = flights.find(x => x.id === d.volId);
      const stamp = { stampLine1: "INCIDENT SÛRETÉ" + (d.lieu ? " · " + d.lieu : (f ? " · " + f.vol : "")), vol: "Incident sûreté", stampAgent: d.agent.trim() };
      openCamera(stamp, (dataUrl, takenAt) => {
        if (!rapportDraft) return;
        rapportDraft.photos.push({ id: uid(), dataUrl, takenAt: takenAt.getTime() });
        showToast("📷 Photo ajoutée au rapport (" + fmtHHMM(takenAt) + ")");
        renderSurete();
      });
    });
    root.querySelectorAll("[data-rf-photo-rm]").forEach(b => b.addEventListener("click", () => {
      d.photos = d.photos.filter(p => p.id !== b.getAttribute("data-rf-photo-rm"));
      renderSurete();
    }));
    const cancel = root.querySelector("[data-rf-cancel]");
    if (cancel) cancel.addEventListener("click", () => {
      const hasContent = d.type || (d.typeAutre || "").trim() || d.description.trim() || d.actions.trim() || d.photos.length;
      if (hasContent && !confirm("Abandonner ce rapport ? Ce qui a été écrit sera perdu.")) return;
      rapportDraft = null; renderSurete();
    });
    const send = root.querySelector("[data-rf-send]");
    if (send) send.addEventListener("click", submitRapport);
  }

  async function submitRapport() {
    const d = rapportDraft;
    if (!d || rapportSending) return;
    const err = document.getElementById("sur-form-err");
    const missing = [];
    if (!d.type) missing.push("le type d'incident");
    else if (d.type === "Autre" && !(d.typeAutre || "").trim()) missing.push("la précision du type (Autre)");
    if (d.description.trim().length < 5) missing.push("les faits constatés");
    if (!d.agent.trim()) missing.push("votre prénom et nom");
    if (missing.length) { if (err) { err.textContent = "Il manque : " + missing.join(", ") + "."; err.classList.add("show"); } return; }
    if (!confirm("Envoyer le rapport ? Une fois envoyé, il ne pourra plus être modifié.")) return;
    rapportSending = true;
    const created = new Date();
    const [hh, mm] = (d.heure || fmtHHMM(created)).split(":").map(Number);
    const inc = new Date(created); inc.setHours(hh || 0, mm || 0, 0, 0);
    if (inc.getTime() > created.getTime() + 60000) inc.setDate(inc.getDate() - 1); // incident de la veille au soir
    const f = flights.find(x => x.id === d.volId);
    const id = uid();
    const r = {
      id, numero: "RS-" + dayKey(created.getTime()).replace(/-/g, "") + "-" + pad(created.getHours()) + pad(created.getMinutes()) + "-" + id.slice(-3).toUpperCase(),
      createdAt: created.getTime(), incidentAt: inc.getTime(),
      type: d.type === "Autre" ? "Autre : " + d.typeAutre.trim() : d.type, gravite: d.gravite, vol: f ? f.vol : "", porte: f ? (f.gate || f.porte || "") : "",
      lieu: d.lieu.trim(), description: d.description.trim(), actions: d.actions.trim(), prevenus: d.prevenus.slice(),
      heureRegulateur: d.heureRegulateur, temoins: d.temoins.trim(), photos: d.photos.slice(), agent: d.agent.trim(),
    };
    let ok = false;
    try { ok = !!(await window.storage.set("rapports-surete/" + r.id, JSON.stringify(r), true)); } catch (e) { ok = false; }
    rapportSending = false;
    if (!ok) {
      renderSurete();
      alert("⚠ Le rapport n'a pas pu être envoyé (connexion ?). Votre texte est conservé : réessayez dans un instant.");
      return;
    }
    const prenom = r.agent.split(/\s+/)[0];
    if (prenom && !monPrenom) { monPrenom = prenom; saveMonPrenom(); }
    if (f) { addHistory(f, "info", "🚨 Rapport sûreté " + r.numero + " : " + r.type, { qui: r.agent }); saveFlights(); }
    rapports.unshift(r);
    rapportDraft = null;
    rapportSent = r;
    renderSurete();
    showToast("✔ Rapport " + r.numero + " envoyé");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

    const blob = new Blob([doc], { type: "text/html;charset=utf-8" });

        </ol>
        <div class="carnet-inc-nums">
          <div>${num("01 48 16 12 12")}</div>
          <div>${num("01 74 37 88 18")}</div>
          <div>${num("01 48 62 62 62")}</div>
        </div>

        <div class="carnet-partie-titre">Pourquoi faire un rapport ?</div>
        <p class="carnet-inc-p">Le rapport garde une trace <b>datée et signée</b> de ce que vous avez vu, de ce que vous avez fait et de qui vous avez prévenu. Il <b>vous couvre</b> : si on vous pose la question plus tard, c'est votre version des faits, écrite sur le moment. Une fois envoyé, il ne peut plus être modifié, et le régulateur le retrouve dans l'extraction de fin de vacation.</p>

        <div class="carnet-partie-titre">Que mettre dans le rapport ?</div>
        <ul class="carnet-list">
          <li><span class="dot">1</span><span><b>Quoi</b> : ce que vous avez constaté, avec des faits simples.</span></li>
          <li><span class="dot">2</span><span><b>Où et quand</b> : vol, porte, lieu précis, heure.</span></li>
          <li><span class="dot">3</span><span><b>Ce que vous avez fait</b> et <b>qui vous avez prévenu</b> (avec l'heure).</span></li>
          <li><span class="dot">4</span><span><b>Témoins</b> éventuels et <b>photos</b> prises sur le moment.</span></li>
        </ul>
        <div class="carnet-alert">Ne jamais quitter les lieux en laissant un accès ouvert ou un objet suspect sans surveillance.</div>
        <button class="carnet-inc-go" data-goto-rapport="1">📝 Faire un rapport maintenant</button>
      </div>
    `;
  }

  let effectuesGate = "toutes";

  function renderEffectues() {
    bodyEl.innerHTML = `
      <div class="gsf2-gate-pills" style="margin-bottom:18px;">
        <button class="gsf2-gate-pill ${effectuesGate === "toutes" ? "active" : ""}" data-egate="toutes">Toutes</button>
        ${GATES.map(g => `<button class="gsf2-gate-pill ${g === effectuesGate ? "active" : ""}" data-egate="${g}">Porte ${g}</button>`).join("")}
      </div>
      <div class="gsf2-grid" id="grid-effectues"></div>
    `;
    document.querySelectorAll("[data-egate]").forEach(btn => {
      btn.addEventListener("click", () => {
        effectuesGate = btn.getAttribute("data-egate");
        document.querySelectorAll("[data-egate]").forEach(b => b.classList.toggle("active", b === btn));
        renderEffectuesGrid();
      });
    });
    renderEffectuesGrid();
  }

  function renderEffectuesGrid() {
    const container = document.getElementById("grid-effectues");
    if (!container) return;
    let list = flights.filter(f => isFlightDone(f));
    if (effectuesGate !== "toutes") list = list.filter(f => f.porte === effectuesGate);
    container.innerHTML = gridHtml(list, { showDelete: true });
    attachCardEvents("grid-effectues");
  }

  document.querySelectorAll(".gsf2-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      activeTab = tab.getAttribute("data-tab");
      document.querySelectorAll(".gsf2-tab").forEach(t => t.classList.toggle("active", t === tab));
      pendingValidation = null;
      animateNextRender = true;
      render();
    });
  });

  // ---- Mode sombre / clair (mémorisé sur cet appareil) ----
  const themeBtn = document.getElementById("gsf2-theme-btn");
  function currentTheme() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
  function syncThemeBtn() {
    if (!themeBtn) return;
    const dark = currentTheme() === "dark";
    themeBtn.textContent = dark ? "☀️" : "🌙";
    themeBtn.title = dark ? "Passer en mode clair" : "Passer en mode sombre";
  }
  syncThemeBtn();
  if (themeBtn) {
    themeBtn.addEventListener("click", () => {
      const next = currentTheme() === "dark" ? "light" : "dark";
      const html = document.documentElement;
      html.classList.add("theme-anim");
      html.setAttribute("data-theme", next);
      try { localStorage.setItem("gsf-theme", next); } catch (e) { /* navigation privée : thème non mémorisé */ }
      themeBtn.classList.toggle("spin");
      syncThemeBtn();
      setTimeout(() => html.classList.remove("theme-anim"), 450);
    });
  }

  function tickClock() {
    const now = new Date();
    clockEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);
  setInterval(updateAlert, 15000);
  setInterval(() => { if (!pendingValidation) renderCurrentGrid(); }, 20000);
  setInterval(() => { if (!pendingValidation) load(); }, 30000);

  // Poussée en temps réel : dès qu'un autre appareil (régulateur ou agent) modifie les vols
  // dans Firebase, on recharge presque immédiatement ici, sans attendre le prochain
  // rafraîchissement périodique (30s). Un petit anti-rebond évite les rechargements en rafale.
  let remoteChangeTimer = null;
  window.onRemoteFlightsChange = () => {
    if (pendingValidation) return; // on ne coupe pas une validation en cours de saisie
    clearTimeout(remoteChangeTimer);
    remoteChangeTimer = setTimeout(() => { load(); }, 600);
  };

  window.addEventListener("beforeunload", (e) => {
    if (!storageHealthy && flights.length > 0) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  load();
})();
</script>

</body>
</html>
