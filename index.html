<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit arrivée · CDG</title>
<style>
  #gsf2-root {
    --bg: #F7F8FB;
    --panel: #FFFFFF;
    --panel-2: #F0F2F7;
    --border: #E3E6ED;
    --text: #12172B;
    --text-dim: #626A82;
    --text-faint: #9AA1B5;
    --primary: #B91C3C;
    --primary-bg: #FBE3E8;
    --success: #059669;
    --success-bg: #DCFAEF;
    --warning: #D97706;
    --warning-bg: #FEF0D8;
    --danger: #DC2626;
    --danger-bg: #FDE4E2;
    --mono: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;

    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    border-radius: 18px;
    max-width: 1120px;
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  #gsf2-root * { box-sizing: border-box; }

  .gsf2-header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 20px 24px 16px; }
  .gsf2-header-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .gsf2-brand { display: flex; align-items: center; gap: 10px; }
  .gsf2-logo {
    width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), #E1435F);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 14px; font-family: var(--mono);
  }
  .gsf2-brand-text-title { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .gsf2-brand-text-sub { font-size: 11.5px; color: var(--text-faint); }

  .gsf2-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .gsf2-agent-field { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border-radius: 20px; padding: 5px 6px 5px 14px; }
  .gsf2-agent-field label { font-size: 11px; color: var(--text-dim); font-weight: 600; }
  .gsf2-agent-field input {
    width: 90px; border: none; background: var(--panel); border-radius: 14px; padding: 5px 10px; font-size: 12.5px; color: var(--text);
  }
  .gsf2-clock { font-family: var(--mono); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .gsf2-status-line { font-size: 11.5px; font-weight: 600; margin: 2px 0 12px; }

  .gsf2-stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .gsf2-stat {
    flex: 1; min-width: 100px; background: var(--panel-2); border-radius: 12px; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .gsf2-stat-num { font-family: var(--mono); font-size: 20px; font-weight: 800; }
  .gsf2-stat-label { font-size: 10.5px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }

  .gsf2-alert {
    display: none; background: var(--danger-bg); color: #8A1F1F; padding: 10px 24px; font-size: 13px; font-weight: 600;
    align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .gsf2-alert.show { display: flex; }
  .gsf2-alert strong { font-family: var(--mono); }

  .gsf2-tabs { display: flex; gap: 6px; padding: 14px 24px 0; }
  .gsf2-tab {
    font-size: 13px; font-weight: 700; color: var(--text-dim); background: var(--panel-2); border: none;
    padding: 10px 20px; border-radius: 10px 10px 0 0; cursor: pointer;
  }
  .gsf2-tab.active { background: var(--primary); color: #fff; }

  .gsf2-body { padding: 22px 24px 26px; background: var(--panel-2); min-height: 240px; }

  .gsf2-toolbar { background: var(--panel); border-radius: 14px; padding: 16px; margin-bottom: 18px; }
  .gsf2-toolbar summary { cursor: pointer; font-weight: 700; font-size: 13.5px; list-style: none; display: flex; align-items: center; gap: 8px; }
  .gsf2-toolbar summary::-webkit-details-marker { display: none; }
  .gsf2-toolbar summary::before { content: "▸"; color: var(--primary); font-size: 11px; transition: transform 0.15s; }
  .gsf2-toolbar[open] summary::before { transform: rotate(90deg); }
  .gsf2-toolbar-content { margin-top: 14px; }
  .gsf2-toolbar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .gsf2-toolbar textarea, .gsf2-toolbar input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 12.5px; font-family: var(--sans);
  }
  .gsf2-toolbar textarea.mono { font-family: var(--mono); font-size: 11.5px; }
  .gsf2-help-text { font-size: 12px; color: var(--text-dim); margin: 8px 0; line-height: 1.5; }
  .gsf2-help-text code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-family: var(--mono); }

  .gsf2-btn {
    font-family: var(--sans); font-size: 13px; font-weight: 700; border: none; border-radius: 9px;
    padding: 10px 18px; cursor: pointer; background: var(--primary); color: #fff;
  }
  .gsf2-btn:hover { background: #8F1730; }
  .gsf2-btn-ghost { background: var(--panel-2); color: var(--text-dim); }
  .gsf2-btn-ghost:hover { color: var(--text); background: #E4E7F0; }
  .gsf2-btn-sm { font-size: 12px; padding: 7px 12px; border-radius: 7px; }

  .gsf2-filterbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .gsf2-filterbar select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 9px;
    padding: 8px 12px; font-size: 12.5px; font-weight: 600;
  }
  .gsf2-gate-pills { display: flex; gap: 6px; }
  .gsf2-gate-pill {
    font-family: var(--mono); font-weight: 800; font-size: 13px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text-dim); padding: 8px 18px; border-radius: 10px; cursor: pointer;
  }
  .gsf2-gate-pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .gsf2-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

  .gsf2-card { background: var(--panel); border-radius: 16px; padding: 16px; border: 1px solid var(--border); position: relative; }
  .gsf2-card.is-bistatut { border: 2px solid #E8B900; background: #FFF6D6; }
  .gsf2-bistatut-chip {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; font-weight: 800;
    background: var(--panel-2); color: var(--text-faint); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; cursor: pointer; margin-bottom: 10px; margin-right: 6px;
  }
  .gsf2-bistatut-chip.on { background: #E8B900; border-color: #E8B900; color: #3A2E00; }
  .gsf2-card.is-complete { opacity: 0.72; }
  .gsf2-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .gsf2-card-vol { font-family: var(--mono); font-size: 19px; font-weight: 800; }
  .gsf2-card-gate {
    font-family: var(--mono); font-weight: 800; font-size: 13px; background: var(--primary-bg); color: var(--primary);
    border-radius: 8px; padding: 4px 10px;
  }
  .gsf2-card-gate.unassigned { background: var(--danger-bg); color: var(--danger); }
  .gsf2-card-delete { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: var(--text-faint); font-size: 15px; cursor: pointer; }
  .gsf2-card-delete:hover { color: var(--danger); }
  .gsf2-card-meta { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .gsf2-card-meta .sep { color: var(--text-faint); }

  .gsf2-blocreel-btn, .gsf2-blocreel-done {
    font-family: var(--mono); font-size: 11px; font-weight: 700; border: 1px solid var(--border);
    border-radius: 7px; padding: 4px 9px; cursor: pointer; background: var(--panel-2); color: var(--text-dim);
  }
  .gsf2-blocreel-done { background: var(--primary-bg); border-color: var(--primary); color: var(--primary); }

  .gsf2-stepper { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .gsf2-step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
  .gsf2-step:not(:last-child)::after {
    content: ""; position: absolute; top: 15px; left: calc(50% + 20px); right: calc(-50% + 20px);
    height: 2px; background: var(--border);
  }
  .gsf2-step-circle {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--border); background: var(--panel);
    display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 800; font-size: 12px;
    color: var(--text-faint); cursor: pointer; z-index: 1; flex-shrink: 0;
  }
  .gsf2-step-circle.done { background: var(--success); border-color: var(--success); color: #fff; }
  .gsf2-step-circle.overdue { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .gsf2-step-circle.soon { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
  .gsf2-step-label { font-size: 9.5px; color: var(--text-dim); font-weight: 700; margin-top: 5px; text-align: center; line-height: 1.2; }
  .gsf2-step-time { font-size: 9px; font-family: var(--mono); color: var(--text-faint); margin-top: 1px; }

  .gsf2-validate-box {
    display: flex; align-items: center; gap: 6px; background: var(--primary-bg); border: 1px solid var(--primary);
    border-radius: 9px; padding: 8px 10px; margin-bottom: 12px;
  }
  .gsf2-validate-box input {
    flex: 1; border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; color: var(--text);
  }
  .gsf2-validate-box button {
    border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .gsf2-validate-confirm { background: var(--primary); color: #fff; }
  .gsf2-validate-cancel { background: var(--panel-2); color: var(--text-dim); }

  .gsf2-forced-chip {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; font-weight: 700;
    background: var(--panel-2); color: var(--text-faint); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; cursor: pointer; margin-bottom: 10px;
  }
  .gsf2-forced-chip.on { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

  .gsf2-comment {
    width: 100%; min-height: 40px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 9px; font-size: 12px; font-family: var(--sans); resize: vertical;
  }
  .gsf2-comment-saved { font-size: 9.5px; color: var(--success); font-family: var(--mono); margin-top: 3px; visibility: hidden; }
  .gsf2-comment-saved.show { visibility: visible; }

  .gsf2-empty { text-align: center; color: var(--text-faint); padding: 50px 20px; font-size: 13.5px; grid-column: 1 / -1; }

  .gsf2-backup { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .gsf2-backup-note { font-size: 11.5px; color: var(--text-faint); flex-basis: 100%; }

  .gsf2-pin-screen { display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
  .gsf2-pin-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 32px 28px; max-width: 300px; width: 100%; text-align: center; }
  .gsf2-pin-icon { font-size: 32px; margin-bottom: 8px; }
  .gsf2-pin-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .gsf2-pin-sub { font-size: 12.5px; color: var(--text-dim); margin-bottom: 18px; }
  .gsf2-pin-input {
    width: 100%; text-align: center; font-family: var(--mono); font-size: 26px; letter-spacing: 10px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 0; color: var(--text);
  }

  @media (max-width: 640px) {
    .gsf2-toolbar-grid { grid-template-columns: 1fr; }
    .gsf2-header-top { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div id="gsf2-root">
  <div class="gsf2-header">
    <div class="gsf2-header-top">
      <div class="gsf2-brand">
        <div class="gsf2-logo">GSF</div>
        <div>
          <div class="gsf2-brand-text-title">Circuit arrivée · CDG</div>
          <div class="gsf2-brand-text-sub">Suivi des vols et jalons</div>
        </div>
      </div>
      <div class="gsf2-right">
        <div class="gsf2-clock" id="gsf2-clock">--:--:--</div>
      </div>
    </div>
    <p class="gsf2-status-line" id="gsf2-storage-status"></p>
    <div class="gsf2-stats" id="gsf2-stats"></div>
  </div>

  <div class="gsf2-alert" id="gsf2-alert"></div>

  <div class="gsf2-tabs">
    <button class="gsf2-tab" data-tab="regulateur">Régulateur</button>
    <button class="gsf2-tab active" data-tab="agent">Missions par porte</button>
    <button class="gsf2-tab" data-tab="effectues">Vols effectués</button>
  </div>

  <div class="gsf2-body" id="gsf2-body">
    <div class="gsf2-empty">Chargement…</div>
  </div>
</div>

<script>
  // --- Shim de compatibilité "window.storage" pour un hébergement hors Claude (Vercel, etc.) ---
  // Remplace l'API propriétaire des artefacts Claude par une sauvegarde locale au navigateur
  // (localStorage). ATTENTION : ceci n'est PAS partagé entre régulateur et agents ni entre
  // appareils différents. Chaque navigateur a sa propre copie des données.
  (function () {
    if (window.storage && typeof window.storage.set === "function") return; // déjà fourni par l'environnement
    window.storage = {
      async get(key) {
        try {
          const raw = localStorage.getItem("gsf_" + key);
          if (raw === null) return null;
          return { value: raw };
        } catch (e) { return null; }
      },
      async set(key, value) {
        try {
          localStorage.setItem("gsf_" + key, value);
          return true;
        } catch (e) { return false; }
      }
    };
  })();
</script>

<script>
(function () {
  const GATES = ["K", "L", "M"];
  const JALONS = {
    ouverture: { label: "Ouverture", short: "OUV", offset: -5, needsPorteur: false },
    mise_en_place: { label: "Mise en place", short: "MEP", offset: -5, needsPorteur: false },
    fermeture: { label: "Fermeture", short: "FER", offset: null, needsPorteur: true },
    go_debarquement: { label: "Go débarquement", short: "GO", offset: 0, needsPorteur: false },
  };
  const JALON_KEYS = Object.keys(JALONS);

  const DEFAULT_GATE_MAPPING = {
    K: "E08=K57\nE14=K55\nE16=K55\nE18=K49\nE20=K45/47\nE22=K43\nE24=K41\nE26=K37/39\nE30=K35\nE32=K33\nE34=K31\nE38=K30\nE40=K32\nE42=K34\nE44=K36",
    L: "E01=L21\nE05=L23\nE09=L25\nE10=L26\nE15=L27\nE17=L29\nE21=L31\nE25=L33\nE27=L33\nE29=L35\nF03=L53\nF09=L49\nF15=L45\nK01=L48\nK09=L46\nK17=L44\nK21=L42\nK53=L22/24\nK59=L26/28\nK65=L30/32\nK71=L34/36",
    M: "K26=M31\nK32=M29\nK38=M27\nK44=M25\nK52=M41\nK58=M43\nK64=M45\nK70=M47\nK76=M49\nL27=M28\nL33=M26\nL39=M24\nL53=M44\nL59=M46\nL65=M48\nL71=M50",
  };

  let flights = [];
  let gateMapping = { K: "", L: "", M: "" };
  let activeTab = "agent";
  let filterGateReg = "toutes";
  let agentGate = "K";
  let monPrenom = "";
  const alertedIds = new Set();
  let audioCtx = null;
  const DEFAULT_REGULATEUR_PIN = "1234";
  let regulateurPin = DEFAULT_REGULATEUR_PIN;
  let regulateurUnlocked = false;

  const bodyEl = document.getElementById("gsf2-body");
  const statsEl = document.getElementById("gsf2-stats");
  const clockEl = document.getElementById("gsf2-clock");

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad(n) { return String(n).padStart(2, "0"); }

  function parseTimeToday(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
  }
  function addMinutes(date, mins) { return new Date(date.getTime() + mins * 60000); }
  function fmtHHMM(date) { return pad(date.getHours()) + ":" + pad(date.getMinutes()); }

  function effectiveBloc(flight) { return flight.heureBlocReel || flight.heureBloc; }

  function computeDeadline(flight, key) {
    const bloc = parseTimeToday(effectiveBloc(flight));
    const j = JALONS[key];
    if (j.needsPorteur) {
      const off = flight.biStatut ? 20 : (flight.porteur === "LC" ? 30 : 15);
      return addMinutes(bloc, off);
    }
    return addMinutes(bloc, j.offset || 0);
  }

  function fmtCountdown(flight, key) {
    const now = new Date();
    const dl = computeDeadline(flight, key);
    let diffMs = dl.getTime() - now.getTime();
    const overdue = diffMs < 0;
    const soon = !overdue && diffMs < 5 * 60000;
    diffMs = Math.abs(diffMs);
    const totalMin = Math.floor(diffMs / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    const str = (h > 0 ? h + "h" : "") + pad(m);
    return { str: (overdue ? "+" : "-") + str, overdue, soon };
  }

  function detectPorteur(vol) {
    const m = (vol || "").match(/\d+/);
    if (!m) return "MC";
    return m[0].length <= 3 ? "LC" : "MC";
  }

  function expandParkingCode(token) {
    const m = token.match(/^([A-Za-z]+)(\d+)\/(\d+)$/);
    if (m) return [(m[1] + m[2]).toUpperCase(), (m[1] + m[3]).toUpperCase(), token.toUpperCase()];
    return [token.toUpperCase()];
  }
  function buildParkingIndex(porte) {
    const index = {};
    const text = gateMapping[porte] || "";
    text.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
      const eq = line.indexOf("=");
      if (eq === -1) return;
      const parkingPart = line.slice(0, eq).trim();
      const gatePart = line.slice(eq + 1).trim();
      if (!parkingPart || !gatePart) return;
      expandParkingCode(parkingPart).forEach(code => { index[code] = gatePart; });
    });
    return index;
  }
  function deriveGateInfo(parking) {
    const parkClean = (parking || "").toUpperCase().trim();
    if (!parkClean) return null;
    for (const g of GATES) {
      const index = buildParkingIndex(g);
      if (index[parkClean]) return { porte: g, gate: index[parkClean] };
    }
    return null;
  }

  function pushFlight(vol, parking, bloc, porteur, porte, gate, biStatut, provenance) {
    flights.push({
      id: uid(), vol, porte, gate, parking, heureBloc: bloc, porteur, biStatut: !!biStatut, provenance: provenance || null,
      jalons: {
        ouverture: { done: false, doneAt: null, qui: null },
        mise_en_place: { done: false, doneAt: null, qui: null },
        fermeture: { done: false, doneAt: null, qui: null },
        go_debarquement: { done: false, doneAt: null, qui: null, forced: false },
      },
      commentaire: "", creeLe: Date.now(), majLe: Date.now(),
    });
  }

  function parseTokens(rawTokens) {
    const tokens = rawTokens.slice();
    let explicitGate = null;
    for (let i = 0; i < tokens.length; i++) {
      if (/^[KLM]$/i.test(tokens[i].trim())) {
        explicitGate = tokens[i].trim().toUpperCase();
        tokens.splice(i, 1);
        break;
      }
    }
    return { tokens, explicitGate };
  }

  // Détection et extraction du format brut ASTRID (liste de vols CDG),
  // dont on ne garde que : n° de vol, parking, heure réelle.
  function isAstridLine(line) {
    const times = line.match(/\b\d{1,2}:\d{2}\b/g) || [];
    return /\bAF\d/i.test(line) && times.length >= 2;
  }

  function parseAstridLine(line) {
    const volMatch = line.match(/\bAF\d[\dA-Z\/]*\b/i);
    if (!volMatch) return null;
    const vol = volMatch[0].toUpperCase();

    const times = line.match(/\b\d{1,2}:\d{2}\b/g) || [];
    let heureReelle = null;
    if (times.length >= 2) heureReelle = times[1];
    else if (times.length === 1) heureReelle = times[0];
    if (heureReelle) {
      const [h, m] = heureReelle.split(":");
      heureReelle = h.padStart(2, "0") + ":" + m;
    }

    const tokens = line.trim().split(/\s+/);
    const volIdx = tokens.findIndex(t => /^AF\d/i.test(t));
    let parking = null;
    let provenance = null;
    if (volIdx !== -1) {
      for (let i = volIdx + 3; i < tokens.length; i++) {
        if (!parking && /^[A-Z]{1,2}\d{1,3}$/.test(tokens[i].toUpperCase())) {
          parking = tokens[i].toUpperCase();
          continue;
        }
        if (!provenance && /^[A-Z]{3}$/.test(tokens[i])) {
          provenance = tokens[i].toUpperCase();
        }
        if (parking && provenance) break;
      }
    }
    // NAVETTE (bus) : token "true"/"false" isolé, ailleurs sur la ligne
    const biStatut = /\btrue\b/i.test(line);
    return { vol, parking, heureReelle, biStatut, provenance };
  }

  let storageHealthy = true;

  async function checkStorage() {
    const el = document.getElementById("gsf2-storage-status");
    if (!el) return false;
    try {
      if (!window.storage || typeof window.storage.set !== "function") {
        storageHealthy = false;
        el.innerHTML = "⚠ Mode local — la sauvegarde partagée n'est pas disponible ici. Vos vols restent visibles sur cet écran, mais ne sont ni partagés ni conservés après fermeture. <strong>Pensez à exporter une sauvegarde régulièrement.</strong>";
        el.style.color = "var(--danger)";
        return false;
      }
      const testVal = String(Date.now());
      const setResult = await window.storage.set("gsf-storage-test", testVal, true);
      if (!setResult) throw new Error("set a échoué");
      const getResult = await window.storage.get("gsf-storage-test", true);
      if (!getResult || getResult.value !== testVal) throw new Error("incohérent");
      storageHealthy = true;
      el.textContent = "● Sauvegarde active — partagée entre régulateur et agents";
      el.style.color = "var(--success)";
      return true;
    } catch (e) {
      storageHealthy = false;
      el.innerHTML = "⚠ Mode local — sauvegarde partagée momentanément indisponible. Vos vols restent visibles sur cet écran. <strong>Pensez à exporter une sauvegarde.</strong>";
      el.style.color = "var(--danger)";
      return false;
    }
  }

  let lastFlightsSaveAt = 0;

  async function saveFlights() {
    try {
      const ok = !!(await window.storage.set("flights", JSON.stringify(flights), true));
      if (ok) lastFlightsSaveAt = Date.now();
      return ok;
    } catch (e) { return false; }
  }
  async function saveGateMapping() {
    try { return !!(await window.storage.set("gate-mapping", JSON.stringify(gateMapping), true)); }
    catch (e) { return false; }
  }
  async function saveMonPrenom() {
    try { await window.storage.set("mon-prenom", JSON.stringify(monPrenom), false); }
    catch (e) { /* ignore */ }
  }

  let flightsLoadedOnce = false;
  let gateMappingLoadedOnce = false;

  async function load() {
    const healthy = await checkStorage();
    if (!healthy) {
      // Mode local : on ne touche pas aux données déjà en mémoire, on continue avec elles.
      if (!flightsLoadedOnce) flights = flights || [];
      if (!gateMappingLoadedOnce) gateMapping = { ...DEFAULT_GATE_MAPPING };
      render();
      return;
    }
    const recentLocalSave = Date.now() - lastFlightsSaveAt < 15000;
    if (!recentLocalSave) {
      try {
        const f = await window.storage.get("flights", true);
        flights = f ? JSON.parse(f.value) : [];
        flightsLoadedOnce = true;
      } catch (e) {
        if (!flightsLoadedOnce) flights = [];
        // sinon : échec transitoire, on garde les vols déjà affichés au lieu de les effacer
      }
    }
    try {
      const g = await window.storage.get("gate-mapping", true);
      gateMapping = g ? JSON.parse(g.value) : { ...DEFAULT_GATE_MAPPING };
      gateMappingLoadedOnce = true;
      if (!g) await saveGateMapping();
    } catch (e) {
      if (!gateMappingLoadedOnce) {
        gateMapping = { ...DEFAULT_GATE_MAPPING };
        await saveGateMapping();
      }
    }
    try {
      const p = await window.storage.get("mon-prenom", false);
      monPrenom = p ? JSON.parse(p.value) : "";
    } catch (e) { /* garder la valeur déjà en mémoire */ }
    try {
      const pin = await window.storage.get("regulateur-pin", true);
      regulateurPin = pin ? JSON.parse(pin.value) : DEFAULT_REGULATEUR_PIN;
      if (!pin) await saveRegulateurPin();
    } catch (e) {
      // garder le code déjà en mémoire (par défaut au premier chargement)
    }
    render();
  }

  async function saveRegulateurPin() {
    try { return !!(await window.storage.set("regulateur-pin", JSON.stringify(regulateurPin), true)); }
    catch (e) { return false; }
  }

  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } catch (e) { /* pas de son dispo */ }
  }

  function updateAlert() {
    const banner = document.getElementById("gsf2-alert");
    if (!banner) return;
    const overdue = flights.filter(f => !f.jalons.fermeture.done && fmtCountdown(f, "fermeture").overdue);
    const soon = flights.filter(f => !f.jalons.fermeture.done && fmtCountdown(f, "fermeture").soon);
    const toAlert = [...overdue, ...soon];
    toAlert.forEach(f => { if (!alertedIds.has(f.id)) { alertedIds.add(f.id); beep(); } });
    flights.forEach(f => { if (f.jalons.fermeture.done && alertedIds.has(f.id)) alertedIds.delete(f.id); });
    if (toAlert.length === 0) { banner.classList.remove("show"); banner.innerHTML = ""; return; }
    banner.classList.add("show");
    banner.innerHTML = "⚠ Fermeture à effectuer : " + toAlert.map(f => `<strong>${f.vol} (${f.gate || f.porte || "?"})</strong>`).join(", ");
  }

  function renderStats() {
    let total = 0, done = 0, overdue = 0;
    flights.forEach(f => {
      JALON_KEYS.forEach(k => {
        total++;
        if (f.jalons[k].done) { done++; return; }
        if (fmtCountdown(f, k).overdue) overdue++;
      });
    });
    const items = [
      { label: "Vols suivis", val: flights.length },
      { label: "Jalons restants", val: total - done },
      { label: "Jalons validés", val: done },
      { label: "En retard", val: overdue },
    ];
    statsEl.innerHTML = items.map(it => `
      <div class="gsf2-stat">
        <div class="gsf2-stat-num" style="color:${it.label === "En retard" && it.val > 0 ? "var(--danger)" : "var(--text)"}">${it.val}</div>
        <div class="gsf2-stat-label">${it.label}</div>
      </div>
    `).join("");
  }

  function render() {
    renderStats();
    updateAlert();
    if (activeTab === "regulateur") renderRegulateur();
    else if (activeTab === "effectues") renderEffectues();
    else renderAgent();
  }

  function renderCurrentGrid() {
    if (activeTab === "regulateur") renderRegGrid();
    else if (activeTab === "effectues") renderEffectuesGrid();
    else renderAgentGrid();
    renderStats();
    updateAlert();

    html += `<option value="non_assignees" ${selected === "non_assignees" ? "selected" : ""}>Non assignées</option>`;
    html += GATES.map(g => `<option value="${g}" ${g === selected ? "selected" : ""}>Porte ${g}</option>`).join("");

  function blocReelHtml(flight) {
    if (flight.heureBlocReel) {
      return `<button class="gsf2-blocreel-done" data-blocreel-id="${flight.id}" title="Mettre à jour">Réel ${flight.heureBlocReel}</button>`;
    }
    return `<button class="gsf2-blocreel-btn" data-blocreel-id="${flight.id}">Pointer bloc réel</button>`;
  }

  function isFlightDone(flight) {
    return JALON_KEYS.every(k => flight.jalons[k].done);
  }

  function stepCircleClass(flight, key) {
    const j = flight.jalons[key];
    if (j.done) return "done";
    const cd = fmtCountdown(flight, key);
    if (cd.overdue) return "overdue";
    if (cd.soon) return "soon";
    return "";
  }

  let pendingValidation = null; // { flightId, key }

  function stepperHtml(flight) {
    return `
      <div class="gsf2-stepper">
        ${JALON_KEYS.map(key => {
          const j = flight.jalons[key];
          const cls = stepCircleClass(flight, key);
          const dl = computeDeadline(flight, key);
          const timeLabel = j.done ? (j.doneAt ? fmtHHMM(new Date(j.doneAt)) : "") : fmtHHMM(dl);
          return `
            <div class="gsf2-step">
              <div class="gsf2-step-circle ${cls}" data-step-id="${flight.id}" data-step-key="${key}" title="${JALONS[key].label}${j.qui ? ' · ' + j.qui : ''}">
                ${j.done ? "✔" : JALONS[key].short.slice(0, 1)}
              </div>
              <div class="gsf2-step-label">${JALONS[key].short}</div>
              <div class="gsf2-step-time">${timeLabel}</div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function cardHtml(f, opts) {
    const allDone = JALON_KEYS.every(k => f.jalons[k].done);
    const gateLabel = f.porte ? (f.gate || f.porte) : "?";
    return `
      <div class="gsf2-card ${allDone ? "is-complete" : ""} ${f.biStatut ? "is-bistatut" : ""}">
        ${opts.showDelete ? `<button class="gsf2-card-delete" data-delete-id="${f.id}" title="Annuler ce vol">✕</button>` : ""}
        <div class="gsf2-card-top">
          <div class="gsf2-card-vol">${f.vol}${f.biStatut ? ' <span style="color:#B08900; font-size:13px;">🚌 BI STATUT</span>' : ""}</div>

            ? `<div class="gsf2-card-gate">${gateLabel}</div>`
            : `<select class="gsf2-card-gate unassigned" data-gate-fix-id="${f.id}" style="border:1px solid var(--danger); font-family:var(--mono); font-weight:800;"><option value="">?</option>${GATES.map(g => `<option value="${g}">${g}</option>`).join("")}</select>`}

            <input id="gsf2-qui-input" type="text" placeholder="Prénom de la personne qui valide" value="${monPrenom || ""}" autofocus />

  function gridHtml(list, opts) {
    if (list.length === 0) return `<div class="gsf2-empty">Aucun vol pour cette sélection.</div>`;
    list.sort((a, b) => parseTimeToday(a.heureBloc) - parseTimeToday(b.heureBloc));
    return list.map(f => cardHtml(f, opts)).join("");
  }

  function attachCardEvents(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll("[data-gate-fix-id]").forEach(sel => {
      sel.addEventListener("change", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-gate-fix-id"));
        if (!flight) return;
        flight.porte = e.currentTarget.value || null;
        flight.majLe = Date.now();
        render();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-blocreel-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-blocreel-id"));
        if (!flight) return;
        const now = new Date();
        flight.heureBlocReel = pad(now.getHours()) + ":" + pad(now.getMinutes());
        flight.majLe = Date.now();
        renderCurrentGrid();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-step-id]").forEach(circle => {
      circle.addEventListener("click", (e) => {
        const id = e.currentTarget.getAttribute("data-step-id");
        const key = e.currentTarget.getAttribute("data-step-key");
        const flight = flights.find(f => f.id === id);
        if (!flight) return;
        const j = flight.jalons[key];
        if (j.done) {
          if (!confirm("Annuler la validation de ce jalon ?")) return;
          j.done = false; j.doneAt = null; j.qui = null;
          flight.majLe = Date.now();
          renderCurrentGrid();
          saveFlights();
        } else {
          pendingValidation = { flightId: id, key };
          renderCurrentGrid();
          const input = document.getElementById("gsf2-qui-input");
          if (input) { input.focus(); input.select(); }
        }
      });
    });
    container.querySelectorAll("[data-confirm-validation]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (!pendingValidation) return;
        const { flightId, key } = pendingValidation;
        const flight = flights.find(f => f.id === flightId);
        const input = document.getElementById("gsf2-qui-input");
        const qui = input ? input.value.trim() : "";
        if (flight) {
          const j = flight.jalons[key];
          j.done = true;
          j.doneAt = Date.now();
          j.qui = qui || null;
          flight.majLe = Date.now();
          if (qui) { monPrenom = qui; saveMonPrenom(); }
        }
        pendingValidation = null;
        renderCurrentGrid();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-cancel-validation]").forEach(btn => {
      btn.addEventListener("click", () => {
        pendingValidation = null;
        renderCurrentGrid();
      });
    });
    container.querySelectorAll("[data-forced-id]").forEach(chip => {
      chip.addEventListener("click", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-forced-id"));
        if (!flight) return;
        flight.jalons.go_debarquement.forced = !flight.jalons.go_debarquement.forced;
        flight.majLe = Date.now();
        renderCurrentGrid();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-bistatut-id]").forEach(chip => {
      chip.addEventListener("click", (e) => {
        const flight = flights.find(f => f.id === e.currentTarget.getAttribute("data-bistatut-id"));
        if (!flight) return;
        flight.biStatut = !flight.biStatut;
        flight.majLe = Date.now();
        renderCurrentGrid();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-delete-id]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        if (!confirm("Annuler ce vol et ses jalons ?")) return;
        flights = flights.filter(f => f.id !== e.currentTarget.getAttribute("data-delete-id"));
        render();
        saveFlights();
      });
    });
    container.querySelectorAll("[data-comment-id]").forEach(area => {
      let timer = null;
      area.addEventListener("input", () => {
        const id = area.getAttribute("data-comment-id");
        clearTimeout(timer);
        timer = setTimeout(() => {
          const flight = flights.find(f => f.id === id);
          if (!flight) return;
          flight.commentaire = area.value;
          flight.majLe = Date.now();
          saveFlights().then(() => {
            const badge = document.getElementById("gsf2-saved-" + id);
            if (badge) { badge.classList.add("show"); setTimeout(() => badge.classList.remove("show"), 1500); }
          });
        }, 700);
      });
    });
  }

      <div class="gsf2-backup" style="background:var(--danger-bg); border:1px solid var(--danger); border-radius:12px; padding:14px 16px;">
        <button class="gsf2-btn" id="btn-fin-vac" style="background:var(--danger);">🏁 Fin de vacation</button>
        <span class="gsf2-backup-note" style="color:#7A241A;">Exporte tous les vols de la journée en Excel/CSV, puis vide entièrement la liste pour repartir à zéro à la prochaine vacation.</span>
      </div>

      <div class="gsf2-backup">
        <button class="gsf2-btn gsf2-btn-sm" id="btn-export-csv">📄 Exporter en tableau lisible (Excel/CSV)</button>
        <button class="${storageHealthy ? "gsf2-btn gsf2-btn-ghost" : "gsf2-btn"} gsf2-btn-sm" id="btn-export">${storageHealthy ? "Sauvegarde technique (.json)" : "⚠ Sauvegarde technique (mode local)"}</button>
        <button class="gsf2-btn gsf2-btn-ghost gsf2-btn-sm" id="btn-import">Importer une sauvegarde (.json)</button>
        <input type="file" id="file-import" accept="application/json" style="display:none;" />
        <span class="gsf2-backup-note">${storageHealthy ? "Sauvegarde automatique déjà active. Le tableau Excel est pour lire/imprimer facilement ; le .json sert à tout restaurer si besoin." : "Mode local actif : rien n'est partagé ni conservé automatiquement. Exportez régulièrement pour ne rien perdre."}</span>
      </div>

      <div class="gsf2-backup" style="margin-top:10px;">
        <span style="font-size:12px; font-weight:700; color:var(--text-dim);">Code d'accès régulateur :</span>
        <input id="pin-change-input" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="Nouveau code" style="width:100px; font-family:var(--mono); text-align:center; background:var(--panel-2); border:1px solid var(--border); border-radius:6px; padding:6px 8px; color:var(--text);" />
        <button class="gsf2-btn gsf2-btn-ghost gsf2-btn-sm" id="pin-change-save">Changer le code</button>
        <span id="pin-change-result" style="font-size:12px; color:var(--success);"></span>
        <button class="gsf2-btn gsf2-btn-ghost gsf2-btn-sm" id="btn-lock-now" style="margin-left:auto;">🔒 Verrouiller maintenant</button>
      </div>
    `;

    document.getElementById("pin-change-save").addEventListener("click", async () => {
      const val = document.getElementById("pin-change-input").value.trim();
      const resEl = document.getElementById("pin-change-result");
      if (!/^\d{4}$/.test(val)) {
        resEl.style.color = "var(--danger)";
        resEl.textContent = "Le code doit faire exactement 4 chiffres.";
        return;
      }
      regulateurPin = val;
      await saveRegulateurPin();
      document.getElementById("pin-change-input").value = "";
      resEl.style.color = "var(--success)";
      resEl.textContent = "✓ Code mis à jour.";
      setTimeout(() => { resEl.textContent = ""; }, 3000);
    });

    document.getElementById("btn-lock-now").addEventListener("click", () => {
      regulateurUnlocked = false;
      render();
    });

    document.getElementById("gm-save").addEventListener("click", async () => {
      GATES.forEach(g => { gateMapping[g] = document.getElementById(`gm-${g}`).value.trim(); });
      await saveGateMapping();
      const c = document.getElementById("gm-confirm");
      c.textContent = "✓ Enregistré";
      setTimeout(() => { c.textContent = ""; }, 3000);
    });

    document.getElementById("ff-gate").addEventListener("change", (e) => {
      filterGateReg = e.target.value;
      renderRegGrid();
    });

    function loadPdfJs() {
      return new Promise((resolve, reject) => {
        if (window.pdfjsLib) { resolve(window.pdfjsLib); return; }
        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
        script.onload = () => {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          resolve(window.pdfjsLib);
        };
        script.onerror = () => reject(new Error("Impossible de charger le lecteur PDF."));
        document.head.appendChild(script);
      });
    }

    document.getElementById("btn-pdf-import").addEventListener("click", () => {
      document.getElementById("pdf-import-input").click();
    });
    document.getElementById("pdf-import-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      const statusEl = document.getElementById("pdf-import-status");
      if (!file) return;
      statusEl.textContent = "Chargement du lecteur PDF…";
      statusEl.style.color = "var(--text-dim)";
      let pdfjsLib;
      try {
        pdfjsLib = await loadPdfJs();
      } catch (err) {
        statusEl.textContent = "⚠ Le lecteur PDF n'a pas pu être chargé (connexion internet ?). Copiez-collez le texte à la place.";
        statusEl.style.color = "var(--danger)";
        e.target.value = "";
        return;
      }
      statusEl.textContent = "Lecture du PDF en cours…";
      statusEl.style.color = "var(--text-dim)";
      try {
        const buffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        let fullText = "";
        for (let p = 1; p <= pdf.numPages; p++) {
          const page = await pdf.getPage(p);
          const content = await page.getTextContent();
          // Regrouper les items par ligne (même position Y approximative)
          const lineMap = new Map();
          content.items.forEach(item => {
            const y = Math.round(item.transform[5]);
            if (!lineMap.has(y)) lineMap.set(y, []);
            lineMap.get(y).push(item);
          });
          const sortedY = Array.from(lineMap.keys()).sort((a, b) => b - a);
          sortedY.forEach(y => {
            const itemsOnLine = lineMap.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
            fullText += itemsOnLine.map(i => i.str).join(" ").replace(/\s+/g, " ").trim() + "\n";
          });
        }
        document.getElementById("bulk-input").value = fullText.trim();
        statusEl.textContent = `✓ PDF lu (${pdf.numPages} page(s)). Vérifiez ci-dessous puis cliquez sur "Importer la liste".`;
        statusEl.style.color = "var(--success)";
      } catch (err) {
        statusEl.textContent = "⚠ Impossible de lire ce PDF. Essayez de copier-coller le texte à la place.";
        statusEl.style.color = "var(--danger)";
      }
      e.target.value = "";
    });


    document.getElementById("btn-html-import").addEventListener("click", () => {
      document.getElementById("html-import-input").click();
    });
    document.getElementById("html-import-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      const statusEl = document.getElementById("pdf-import-status");
      if (!file) return;
      statusEl.textContent = "Lecture de la page FlightViz en cours…";
      statusEl.style.color = "var(--text-dim)";
      try {
        const text = await file.text();
        const doc = new DOMParser().parseFromString(text, "text/html");
        const table = doc.querySelector("table");
        if (!table) throw new Error("no table");
        const rows = Array.from(table.querySelectorAll("tr")).slice(1); // sans l'en-tête

        const results = [];
        let skippedNoDhc = 0;
        rows.forEach(r => {
          const cells = r.querySelectorAll("td");
          if (cells.length < 10) return;

          const dhcCell = cells[5].cloneNode(true);
          const dropdown = dhcCell.querySelector("surveillance-dropdown");
          if (dropdown) dropdown.remove();
          const dhcTxt = (dhcCell.textContent || "").trim();
          const dhcMatch = dhcTxt.match(/\d{1,2}:\d{2}/);
          if (!dhcMatch) { skippedNoDhc++; return; }
          const dhc = dhcMatch[0];

          const volTxt = (cells[6].textContent || "").trim();
          const volMatch = volTxt.match(/AF\s?\d+[A-Z]?(?:\/\d+)?/i);
          if (!volMatch) return;
          const vol = volMatch[0].replace(/\s+/g, "").toUpperCase();

          const prov = (cells[7].textContent || "").trim().toUpperCase();
          const parkg = (cells[8].textContent || "").trim().toUpperCase();
          const busIcon = cells[9].querySelector("svg, i, img, [class*='bus' i]");

          const line = [vol, parkg, dhc, prov];
          if (busIcon) line.push("BUS");
          results.push(line.join("\t"));
        });

        if (results.length === 0) {
          statusEl.textContent = "⚠ Aucun vol avec heure réelle (DHC) trouvé dans ce fichier. Vérifiez que c'est bien la page FlightViz enregistrée complète.";
          statusEl.style.color = "var(--danger)";
        } else {
          document.getElementById("bulk-input").value = results.join("\n");
          statusEl.textContent = `✓ ${results.length} vol(s) lu(s) directement depuis la page (${skippedNoDhc} sans heure réelle pour l'instant, ignorés). Vérifiez puis cliquez sur "Importer la liste".`;
          statusEl.style.color = "var(--success)";
        }
      } catch (err) {
        statusEl.textContent = "⚠ Impossible de lire ce fichier. Vérifiez que c'est bien un .html enregistré depuis FlightViz (page web complète).";
        statusEl.style.color = "var(--danger)";
      }
      e.target.value = "";
    });

    document.getElementById("mf-submit").addEventListener("click", async () => {
      const resultEl = document.getElementById("mf-result");
      const vol = document.getElementById("mf-vol").value.trim().toUpperCase();
      const parking = document.getElementById("mf-parking").value.trim().toUpperCase();
      const bloc = document.getElementById("mf-bloc").value;
      const porteurSel = document.getElementById("mf-porteur").value;
      const provenance = document.getElementById("mf-provenance").value.trim().toUpperCase() || null;
      const biStatut = document.getElementById("mf-bistatut").checked;

      if (!vol) { resultEl.innerHTML = `<span style="color:var(--danger);">Numéro de vol manquant.</span>`; return; }
      if (!bloc) { resultEl.innerHTML = `<span style="color:var(--danger);">Heure de bloc manquante.</span>`; return; }

      const porteur = porteurSel || detectPorteur(vol);
      const gateInfo = parking ? deriveGateInfo(parking) : null;
      const porte = gateInfo ? gateInfo.porte : null;
      const gate = gateInfo ? gateInfo.gate : null;

      pushFlight(vol, parking, bloc, porteur, porte, gate, biStatut, provenance);
      const ok = await saveFlights();
      filterGateReg = "toutes";

      document.getElementById("mf-vol").value = "";
      document.getElementById("mf-parking").value = "";
      document.getElementById("mf-bloc").value = "";
      document.getElementById("mf-porteur").value = "";
      document.getElementById("mf-provenance").value = "";
      document.getElementById("mf-bistatut").checked = false;

      render();
      const finalResultEl = document.getElementById("mf-result");
      if (finalResultEl) {
        let msg = `✓ Vol ${vol} ajouté.`;
        if (parking && !porte) msg += ` <span style="color:var(--danger);">Porte non déduite pour "${parking}" — à assigner manuellement.</span>`;
        if (!ok) msg += ` <span style="color:var(--danger);">⚠ Mode local : sauvegarde partagée indisponible.</span>`;
        finalResultEl.innerHTML = msg;
      }
    });

    document.getElementById("bulk-submit").addEventListener("click", async () => {
      const raw = document.getElementById("bulk-input").value;
      const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
      let added = 0;
      const errors = [];
      const astridMode = lines.some(isAstridLine);

      function splitLine(line) {
        let parts = line.split(/\t|;|,/).map(p => p.trim()).filter(p => p !== "");
        if (parts.length >= 3) return parts;
        parts = line.split(/\s{2,}/).map(p => p.trim()).filter(p => p !== "");
        if (parts.length >= 3) return parts;
        return line.split(/\s+/).map(p => p.trim()).filter(p => p !== "");
      }
      function normalizeBloc(raw) {
        const s = (raw || "").trim();
        let m = s.match(/^(\d{1,2})[:h.hH](\d{2})/);
        if (m) return m[1].padStart(2, "0") + ":" + m[2];
        m = s.match(/^(\d{2})(\d{2})$/);
        if (m) return m[1] + ":" + m[2];
        return null;
      }

      if (astridMode) {
        lines.forEach((line, idx) => {
          const parsed = parseAstridLine(line);
          if (!parsed) return; // ligne d'en-tête, de filtre ou de pied de page : ignorée silencieusement
          const { vol, parking, heureReelle, biStatut, provenance } = parsed;
          if (!heureReelle) { errors.push(`Ligne ${idx + 1} : heure réelle introuvable → "${line}"`); return; }
          const porteur = detectPorteur(vol);
          const gateInfo = parking ? deriveGateInfo(parking) : null;
          const porte = gateInfo ? gateInfo.porte : null;
          const gate = gateInfo ? gateInfo.gate : null;
          pushFlight(vol, parking, heureReelle, porteur, porte, gate, biStatut, provenance);
          added++;
          if (parking && !porte) errors.push(`Ligne ${idx + 1} : porte non déduite pour "${parking}" (${vol}) — à assigner manuellement.`);
          if (!parking) errors.push(`Ligne ${idx + 1} : pas de parking pour ${vol} (probablement annulé) — porte à assigner manuellement si besoin.`);
        });
      } else {
        lines.forEach((line, idx) => {
          const rawParts = splitLine(line);
          const { tokens: parts, explicitGate } = parseTokens(rawParts);
          if (parts.length < 3) { errors.push(`Ligne ${idx + 1} : pas assez d'informations → "${line}"`); return; }
          const [volRaw, parkingRaw, blocRaw, ...rest] = parts;
          const vol = (volRaw || "").toUpperCase();
          const parking = (parkingRaw || "").toUpperCase();
          const bloc = normalizeBloc(blocRaw);
          let porteurRaw = null, provenance = null, biStatut = false;
          rest.forEach(tok => {
            const up = (tok || "").toUpperCase();
            if (/^(MC|LC)$/.test(up)) porteurRaw = up;
            else if (/^BUS$/.test(up)) biStatut = true;
            else if (/^[A-Z]{3}$/.test(up)) provenance = up;
          });
          const porteur = porteurRaw || detectPorteur(vol);
          const gateInfo = deriveGateInfo(parking);
          const porte = explicitGate || (gateInfo ? gateInfo.porte : null);
          const gate = explicitGate ? explicitGate : (gateInfo ? gateInfo.gate : null);

          if (!vol) { errors.push(`Ligne ${idx + 1} : numéro de vol manquant → "${line}"`); return; }
          if (!bloc) { errors.push(`Ligne ${idx + 1} : heure de bloc illisible → "${line}"`); return; }

          pushFlight(vol, parking, bloc, porteur, porte, gate, biStatut, provenance);
          added++;
          if (!porte) errors.push(`Ligne ${idx + 1} : porte non déduite pour "${parking}" — à assigner manuellement.`);
        });
      }

      let msg = `${added} vol(s) ajouté(s)${astridMode ? " (format ASTRID détecté automatiquement)" : ""}.`;
      if (errors.length) msg += `<br/>` + errors.map(e => `<span style="color:var(--text-dim); font-size:11px;">• ${e}</span>`).join("<br/>");
      if (added > 0) {
        const ok = await saveFlights();
        filterGateReg = "toutes";
        if (!ok) msg += `<br/><span style="color:var(--danger);">⚠ Mode local : sauvegarde partagée indisponible, mais les vols restent affichés ici. Pensez à exporter.</span>`;
        document.getElementById("bulk-input").value = "";
      }
      render();
      const finalResultEl = document.getElementById("bulk-result");
      if (finalResultEl) finalResultEl.innerHTML = msg;
    });

    function exportCsv(filenamePrefix) {
      const headers = [
        "N° vol", "Porte", "Gate", "Parking", "Heure bloc", "Heure réelle bloc", "Porteur", "Bi statut (bus)",
        "Ouverture", "Qui (ouverture)",
        "Mise en place", "Qui (mise en place)",
        "Fermeture", "Qui (fermeture)",
        "GO débarquement", "Qui (GO)", "GO forcé",
        "Commentaire",
      ];
      function esc(v) {
        const s = (v === null || v === undefined) ? "" : String(v);
        return `"${s.replace(/"/g, '""')}"`;
      }
      const rows = flights.slice()
        .sort((a, b) => parseTimeToday(a.heureBloc) - parseTimeToday(b.heureBloc))
        .map(f => {
          const j = f.jalons;
          const t = (key) => j[key].doneAt ? fmtHHMM(new Date(j[key].doneAt)) : "";
          return [
            f.vol, f.porte || "", f.gate || "", f.parking || "", f.heureBloc, f.heureBlocReel || "", f.porteur || "", f.biStatut ? "OUI" : "",
            t("ouverture"), j.ouverture.qui || "",
            t("mise_en_place"), j.mise_en_place.qui || "",
            t("fermeture"), j.fermeture.qui || "",
            t("go_debarquement"), j.go_debarquement.qui || "", j.go_debarquement.forced ? "OUI" : "",
            f.commentaire || "",
          ].map(esc).join(";");
        });
      const csv = "\uFEFF" + [headers.map(esc).join(";"), ...rows].join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${filenamePrefix}-${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById("btn-export-csv").addEventListener("click", () => {
      exportCsv("vols-circuit-arrivee");
    });

    document.getElementById("btn-fin-vac").addEventListener("click", async () => {
      if (flights.length === 0) {
        alert("Aucun vol à exporter.");
        return;
      }
      if (!confirm(`Fin de vacation : ${flights.length} vol(s) vont être exportés en Excel/CSV, puis la liste sera entièrement vidée pour repartir à zéro. Continuer ?`)) return;
      exportCsv("fin-de-vac");
      flights = [];
      await saveFlights();
      render();
      alert("Export terminé et liste vidée. Bonne fin de journée !");
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      const data = { exportedAt: new Date().toISOString(), flights };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `gsf-sauvegarde-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    document.getElementById("btn-import").addEventListener("click", () => document.getElementById("file-import").click());
    document.getElementById("file-import").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const restored = Array.isArray(parsed) ? parsed : parsed.flights;
          if (!Array.isArray(restored)) throw new Error("format invalide");
          if (!confirm(`Restaurer ${restored.length} vol(s) ?`)) return;
          flights = restored;
          await saveFlights();
          render();
        } catch (err) { alert("Fichier de sauvegarde illisible."); }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    renderRegGrid();
  }

  function renderRegGrid() {
    const container = document.getElementById("grid-regulateur");
    if (!container) return;
    let list = flights.filter(f => !isFlightDone(f));
    if (filterGateReg === "non_assignees") list = list.filter(f => !f.porte);
    else if (filterGateReg !== "toutes") list = list.filter(f => f.porte === filterGateReg);
    container.innerHTML = gridHtml(list, { showDelete: true });
    attachCardEvents("grid-regulateur");
  }

  function renderAgent() {
    bodyEl.innerHTML = `
      <div class="gsf2-gate-pills" style="margin-bottom:18px;">
        ${GATES.map(g => `<button class="gsf2-gate-pill ${g === agentGate ? "active" : ""}" data-gate="${g}">Porte ${g}</button>`).join("")}
      </div>
      <div class="gsf2-grid" id="grid-agent"></div>
    `;
    document.querySelectorAll(".gsf2-gate-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        agentGate = btn.getAttribute("data-gate");
        document.querySelectorAll(".gsf2-gate-pill").forEach(b => b.classList.toggle("active", b === btn));
        renderAgentGrid();
      });
    });
    renderAgentGrid();
  }

  function renderAgentGrid() {
    const container = document.getElementById("grid-agent");
    if (!container) return;
    const list = flights.filter(f => (f.porte === agentGate || !f.porte) && !isFlightDone(f));
    container.innerHTML = gridHtml(list, { showDelete: false });
    attachCardEvents("grid-agent");
  }

  let effectuesGate = "toutes";

  function renderEffectues() {
    bodyEl.innerHTML = `
      <div class="gsf2-gate-pills" style="margin-bottom:18px;">
        <button class="gsf2-gate-pill ${effectuesGate === "toutes" ? "active" : ""}" data-egate="toutes">Toutes</button>
        ${GATES.map(g => `<button class="gsf2-gate-pill ${g === effectuesGate ? "active" : ""}" data-egate="${g}">Porte ${g}</button>`).join("")}
      </div>
      <div class="gsf2-grid" id="grid-effectues"></div>
    `;
    document.querySelectorAll("[data-egate]").forEach(btn => {
      btn.addEventListener("click", () => {
        effectuesGate = btn.getAttribute("data-egate");
        document.querySelectorAll("[data-egate]").forEach(b => b.classList.toggle("active", b === btn));
        renderEffectuesGrid();
      });
    });
    renderEffectuesGrid();
  }

  function renderEffectuesGrid() {
    const container = document.getElementById("grid-effectues");
    if (!container) return;
    let list = flights.filter(f => isFlightDone(f));
    if (effectuesGate !== "toutes") list = list.filter(f => f.porte === effectuesGate);
    container.innerHTML = gridHtml(list, { showDelete: true });
    attachCardEvents("grid-effectues");
  }

  document.querySelectorAll(".gsf2-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      activeTab = tab.getAttribute("data-tab");
      document.querySelectorAll(".gsf2-tab").forEach(t => t.classList.toggle("active", t === tab));
      render();
    });
  });

  function tickClock() {
    const now = new Date();
    clockEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  }
  tickClock();
  setInterval(tickClock, 1000);
  setInterval(() => { if (!pendingValidation) renderCurrentGrid(); }, 20000);
  setInterval(() => { if (!pendingValidation) load(); }, 30000);

  window.addEventListener("beforeunload", (e) => {
    if (!storageHealthy && flights.length > 0) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  load();
})();
</script>
